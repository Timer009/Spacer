<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spacer 屏幕方向检查</title>
<style>
  :root{color-scheme:dark;background:#050810;color:#e8f4ff;font:16px system-ui,sans-serif}
  body{margin:0;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
    calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  #insets{position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right)
    env(safe-area-inset-bottom) env(safe-area-inset-left)}
  textarea{display:block;box-sizing:border-box;width:100%;max-width:54rem;margin:12px 0;font:13px monospace}
  button{min-height:44px;padding:0 14px}
</style>
</head>
<body>
<div id="insets" aria-hidden="true"></div>
<h1>屏幕方向检查</h1>
<p>在要测试的浏览器独立标签页打开。竖屏时记录一次，把手机横过来，等一秒后记录第二次，再复制结果。</p>
<button type="button" data-capture="0">记录竖放时</button>
<button type="button" data-capture="1">记录横放后</button>
<textarea id="details" rows="10" aria-label="屏幕尺寸及事件" readonly></textarea>
<button id="copy" type="button">复制结果</button> <span id="status" role="status"></span>
<script>
'use strict';
const visual = window.visualViewport;
const landscape = matchMedia('(orientation: landscape)');
const field = document.getElementById('details');
const entries = ['页面启动'];
const captures = [null, null];
function dimensions() {
  return 'window ' + innerWidth + '×' + innerHeight + ' · visible ' +
    (visual ? Math.round(visual.width) + '×' + Math.round(visual.height) + ' @ ' + Number(visual.scale).toFixed(3) : 'unavailable');
}
function measure() {
  const safe = getComputedStyle(document.getElementById('insets'));
  const orientation = screen.orientation;
  return [
    dimensions(),
    'document container: ' + document.documentElement.clientWidth + '×' + document.documentElement.clientHeight,
    'screen: ' + screen.width + '×' + screen.height + ' · DPR ' + devicePixelRatio,
    'orientation: ' + (orientation ? orientation.type + ' ' + orientation.angle + '°' : 'unavailable') +
      ' · legacy angle ' + (window.orientation ?? 'unavailable'),
    'matchMedia: ' + (landscape.matches ? 'landscape' : 'portrait'),
    'safe area: ' + [safe.paddingTop, safe.paddingRight, safe.paddingBottom, safe.paddingLeft].join(' / '),
  ].join('\n');
}
function read() {
  const orientation = screen.orientation;
  return [
    'Spacer · Sprint 09 横屏验收版',
    'Git commit: ' + (location.pathname.match(/(?:^|\/)([0-9a-f]{40})(?:\/|$)/i)?.[1] || '当前 URL 未固定到提交'),
    'Browser: ' + navigator.userAgent,
    'Context: ' + (window.top === window ? 'top-level' : 'embedded'),
    'Pointer: coarse ' + matchMedia('(pointer: coarse)').matches + ' · touch points ' + navigator.maxTouchPoints,
    'API: ResizeObserver ' + (typeof ResizeObserver === 'function') +
      ' · requestFullscreen ' + (typeof document.documentElement.requestFullscreen === 'function') +
      ' · fullscreenEnabled ' + (document.fullscreenEnabled ?? 'unavailable') +
      ' · orientation.lock ' + (typeof orientation?.lock === 'function') +
      ' · fullscreen policy ' + ((document.permissionsPolicy || document.featurePolicy)?.allowsFeature?.('fullscreen') ?? 'unknown'),
    '', '当前读数', measure(),
    '', '竖放时记录', captures[0] || '未记录',
    '', '横放后记录', captures[1] || '未记录', '',
    'Recent events:', ...entries,
  ].join('\n');
}
function listen(target, event, label) {
  if (!target) return;
  const update = () => {
    entries.unshift(Math.round(performance.now()) + 'ms ' + label + ' · ' + dimensions());
    entries.length = Math.min(12, entries.length);
    if (document.activeElement !== field) field.value = read();
  };
  if (target.addEventListener) target.addEventListener(event, update, {passive:true});
  else if (event === 'change') target.addListener?.(update);
}
listen(window, 'resize', 'window.resize');
listen(window, 'orientationchange', 'window.orientationchange');
listen(window, 'pageshow', 'window.pageshow');
listen(visual, 'resize', 'visualViewport.resize');
listen(visual, 'scroll', 'visualViewport.scroll');
listen(screen.orientation, 'change', 'screen.orientation.change');
listen(landscape, 'change', 'matchMedia.orientation');
if (typeof ResizeObserver === 'function') {
  const observer = new ResizeObserver(() => {
    entries.unshift(Math.round(performance.now()) + 'ms ResizeObserver.container · ' + dimensions());
    entries.length = Math.min(12, entries.length);
    if (document.activeElement !== field) field.value = read();
  });
  observer.observe(document.documentElement);
}
field.addEventListener('blur', () => { field.value = read(); });
field.value = read();
for (const button of document.querySelectorAll('[data-capture]')) {
  button.addEventListener('click', () => {
    captures[Number(button.dataset.capture)] = measure();
    field.value = read();
    document.getElementById('status').textContent = '已' + button.textContent;
  });
}
document.getElementById('copy').addEventListener('click', async () => {
  field.value = read();
  const status = document.getElementById('status');
  try {
    await navigator.clipboard.writeText(field.value);
    status.textContent = '已复制';
  } catch {
    field.focus();
    field.select();
    status.textContent = '请长按或使用系统复制';
  }
});
</script>
</body>
</html>
