// A +90 degree viewport maps logical vertical motion to negative client X.
function bindRotatedScroll(el) {
  let gesture = null, blockClick = false;
  el.addEventListener('touchstart', e => {
    blockClick = false;
    gesture = virtualLandscape && e.touches.length === 1 && el.scrollHeight > el.clientHeight
      ? {x:e.touches[0].clientX, y:e.touches[0].clientY, top:el.scrollTop, scrolling:false}
      : null;
  }, {passive:true});
  el.addEventListener('touchmove', e => {
    if (!gesture || !virtualLandscape || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - gesture.x, dy = e.touches[0].clientY - gesture.y;
    if (!gesture.scrolling) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 6) return;
      if (Math.abs(dy) > Math.abs(dx)) { gesture = null; return; }
      gesture.scrolling = true;
    }
    e.preventDefault();
    el.scrollTop = gesture.top + dx * el.offsetHeight / el.getBoundingClientRect().width;
    blockClick = true;
  }, {passive:false});
  for (const type of ['touchend','touchcancel']) el.addEventListener(type, () => { gesture = null; });
  el.addEventListener('click', e => {
    if (blockClick && e.detail) { e.preventDefault(); e.stopImmediatePropagation(); }
    blockClick = false;
  }, true);
}

    'Canvas: ' + cvs.width + '×' + cvs.height + ' px · CSS ' + rect.width + '×' + rect.height + ' CSS px',
    'Game: ' + (W >= H ? 'landscape' : 'portrait') + ' · ' + state + (isPaused() ? ' · paused' : '') +
      ' · viewport source: ' + (visual && preferVisual && visual.width > 0 &&
        Math.abs(visual.scale - 1) < 0.01 ? 'visualViewport' : 'window') +
      (document.body.classList.contains('rotate-hint') ? ' · rotate hint' : ''),
    'Safe area (top/right/bottom/left): ' + [safeTop, safeRight, safeBottom, safeLeft].join(' / ') + ' px',
    'API: ResizeObserver ' + (typeof ResizeObserver === 'function') +
      ' · requestFullscreen ' + (typeof document.documentElement.requestFullscreen === 'function') +
      ' · fullscreenEnabled ' + (document.fullscreenEnabled ?? 'unavailable') +
      ' · orientation.lock ' + (typeof orientation?.lock === 'function') +
      ' · fullscreen policy ' + ((document.permissionsPolicy || document.featurePolicy)?.allowsFeature?.('fullscreen') ?? 'unknown'),
    'Native request: ' + (nativeStatus || 'none'),
    'Recent events:',
    ...viewportEvents,
  ].join('\n');
}
function updateViewportDebug() {
  const field = document.getElementById('viewportDetails');
  if (document.activeElement !== field) field.value = viewportDebugText();
}
if (debugEnabled) {
  debugPanel.hidden = false;
  viewportEvents.push('页面启动');
  debugPanel.addEventListener('toggle', updateViewportDebug);
  document.getElementById('copyViewport').addEventListener('click', async () => {
    const field = document.getElementById('viewportDetails');
    const status = document.getElementById('copyViewportStatus');
    field.value = viewportDebugText();
    try {
      await navigator.clipboard.writeText(field.value);
      status.textContent = '已复制';
    } catch {
      field.focus();
      field.select();
      status.textContent = '请长按或使用系统复制';
    }
  });
}

/* ---------- 启动 ---------- */
listenViewport(window, 'resize', 'window.resize');
listenViewport(window, 'orientationchange', 'window.orientationchange', true);
listenViewport(window, 'pageshow', 'window.pageshow');
listenViewport(visual, 'resize', 'visualViewport.resize');
listenViewport(visual, 'scroll', 'visualViewport.scroll');
listenViewport(screen.orientation, 'change', 'screen.orientation.change', true);
listenViewport(landscapeQuery, 'change', 'matchMedia.orientation', true);
listenViewport(coarseQuery, 'change', 'matchMedia.pointer');
if (typeof ResizeObserver === 'function') {
  const observer = new ResizeObserver(() => invalidateViewport('ResizeObserver.container'));
  observer.observe(viewportHost);
}
if (launchParams.get('compat') === '1') selectDirectionMode('compatible');
resize();
loadLevel(0);
ship.visible = false;   // 标题画面只展示地形
setAmbience(null);
state = 'title';
requestAnimationFrame(frame);
</script>
</body>
