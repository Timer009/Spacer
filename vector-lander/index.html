<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>矢量着陆 · Vector Lander — 太阳系航线</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
  :root{--safe-t:env(safe-area-inset-top, 0px);--safe-b:env(safe-area-inset-bottom, 0px);--safe-l:env(safe-area-inset-left, 0px);--safe-r:env(safe-area-inset-right, 0px)}
  html,body{margin:0;padding:0;height:100%;background:#04060e;overflow:hidden;
    overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  body,body *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  #viewportHost{position:fixed;inset:0;overflow:hidden}
  #gameViewport{position:absolute;inset:0;overflow:hidden;transform-origin:0 0}
  #gameViewport.virtual-landscape{transform:translateX(var(--host-width)) rotate(90deg)}
  #cv{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:crosshair;touch-action:none;
    -webkit-touch-callout:none;user-select:none}
  #safeArea{position:absolute;visibility:hidden;pointer-events:none;
    padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
  .iconBtn{display:flex;align-items:center;justify-content:center;box-sizing:border-box;
    width:44px;height:44px;padding:0;border-radius:50%;
    border:1px solid rgba(120,220,255,.65);background:rgba(8,20,38,.92);color:#bfe9ff;
    touch-action:none;cursor:pointer}
  .iconBtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .tbtn{position:absolute;bottom:calc(12px + var(--safe-b));width:clamp(48px,19%,76px);
    height:auto;min-height:44px;aspect-ratio:1;display:none;z-index:10;background:rgba(8,20,38,.72)}
  .tbtn.active{background:#235892}
  body.touch-ui.touch-play .tbtn{display:flex}
  #btnL{left:calc(12px + var(--safe-l))}
  #btnR{left:calc(32px + var(--safe-l) + clamp(48px,19%,76px))}
  #btnT{right:calc(12px + var(--safe-r));width:clamp(54px,22%,88px);
    color:#ffc35e;border-color:#ffc35e}
  #statsBtn,#pauseBtn{position:absolute;right:calc(12px + var(--safe-r));
    top:calc(8px + var(--safe-t));display:none;z-index:10}
  body.touch-ui.map-open #statsBtn,body.touch-ui.pause-open #pauseBtn{display:flex}
  body.touch-ui.panel-open #statsBtn,body.touch-ui.panel-open #pauseBtn{display:none}
  #rotateHint{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;background:rgba(2,5,12,.97);
    color:#e8f4ff;text-align:center;box-sizing:border-box;overflow:auto;
    padding:calc(12px + var(--safe-t)) calc(16px + var(--safe-r)) calc(12px + var(--safe-b)) calc(16px + var(--safe-l));
    font:14px 'Courier New','Microsoft YaHei',monospace;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body.rotate-hint #rotateHint{display:flex}
  .compact-hint #rotateHint{gap:6px;justify-content:safe center}
  .compact-hint .rotPhone{display:none}
  .rotPhone{width:52px;height:92px;border:3px solid #59ffc8;border-radius:10px;
    margin-bottom:10px;box-shadow:0 0 24px rgba(89,255,200,.3);
    animation:rotPhone 2.4s ease-in-out infinite}
  @keyframes rotPhone{0%,20%{transform:rotate(0)}70%,100%{transform:rotate(90deg)}}
  .rotTitle{font-size:22px;font-weight:bold;color:#e8f4ff}
  .rotSub{font-size:13px;color:#9db8d8;line-height:1.6;max-width:300px}
  .rotBtn{margin-top:6px;padding:8px 18px;border-radius:16px;
    border:1px solid rgba(120,220,255,.6);background:rgba(20,40,70,.6);
    color:#bfe9ff;font:13px 'Courier New','Microsoft YaHei',monospace;
    cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none}
  .rotBtn{min-height:44px}
  @media (prefers-reduced-motion:reduce){.rotPhone{animation:none}}
  #rotateTry{border-color:#59ffc8;background:rgba(24,80,64,.6);color:#e8f4ff}
  #rotateCompat{border-color:#59ffc8}
  #rotateSkip{font-size:12px;opacity:.8;padding:6px 14px}
  #gear{position:absolute;left:calc(12px + var(--safe-l));top:calc(8px + var(--safe-t));z-index:11}
  #panel{position:absolute;left:calc(14px + var(--safe-l));top:calc(58px + var(--safe-t));
    width:min(300px, calc(100% - 28px - var(--safe-l) - var(--safe-r)));box-sizing:border-box;
    max-height:calc(100% - 70px - var(--safe-t) - var(--safe-b));
    overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
    background:#0b1426;border:1px solid rgba(120,220,255,.4);
    border-radius:8px;padding:12px 14px;z-index:12;color:#bfe0ff;
    -webkit-touch-callout:none;user-select:none;
    font:13px 'Courier New','Microsoft YaHei',monospace}
  .virtual-landscape #panel,.virtual-landscape .modeScreen{touch-action:none;overscroll-behavior:contain}
  #quickFlight{margin-top:8px;color:#b4cce2}
  #quickFlight summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:#a8d7d8}
  #quickFlight summary::before{content:'+';margin-right:8px}
  #quickFlight[open] summary::before{content:'−'}
  #quickFlight p{font-size:12px;margin-bottom:6px}
  #titleScreen{bottom:calc(34px + var(--safe-b))}
  #menuVersion{position:absolute;left:calc(16px + var(--safe-l));bottom:calc(8px + var(--safe-b));
    color:#aac1d7;font:12px monospace;pointer-events:none}
  body.rotate-hint #menuVersion{visibility:hidden}
  .qualitySetting{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0}
  #qualitySelect{min-height:44px;min-width:90px;color:inherit;background:#1a2936;border:1px solid #486472;border-radius:5px}
  #buildDetails{color:#bfe0ff;white-space:pre-line;margin:8px 0;overflow-wrap:anywhere}
  #buildCopyField{width:100%;box-sizing:border-box;color:inherit;background:#04060e}
  #buildCopyField,#buildCopyField:focus{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
  #panelTitle{color:#e8f4ff;margin-bottom:8px;font-weight:bold}
  .prow{margin:8px 0}
  .prow label{display:flex;justify-content:space-between;margin-bottom:3px;color:#9db8d8}
  .prow input[type=range]{width:100%;accent-color:#56d9ff}
  .crow{display:flex;justify-content:space-between;align-items:center;margin:9px 0;color:#9db8d8}
  .crow input{accent-color:#56d9ff;width:16px;height:16px}
  #panelBtns{margin-top:10px;display:flex;gap:8px}
  #panelBtns button{flex:1;background:rgba(60,110,180,.4);border:1px solid rgba(120,220,255,.5);
    color:#e8f4ff;min-height:44px;padding:5px 0;cursor:pointer;border-radius:4px;
    font:12px 'Courier New','Microsoft YaHei',monospace}
  .skinRow{margin:10px 0 4px}
  .skinLab{color:#9db8d8;margin-bottom:5px}
  .skinBtns{display:flex;gap:6px}
  .skinBtn{flex:1;background:rgba(40,70,110,.45);border:1px solid rgba(120,220,255,.35);
    color:#bfe0ff;min-height:44px;padding:5px 0;cursor:pointer;border-radius:4px;
    font:12px 'Courier New','Microsoft YaHei',monospace}
  .skinBtn.active{background:rgba(70,150,255,.6);border-color:#59ffc8;color:#fff}
  #homeBtn{position:absolute;left:calc(62px + var(--safe-l));top:calc(8px + var(--safe-t));z-index:10;font:12px monospace}
  #homeBtn[hidden],#missionActions[hidden],.modeScreen[hidden]{display:none}
  #missionActions{margin-bottom:12px}
  .modeScreen{position:absolute;z-index:8;display:flex;flex-direction:column;overflow:auto;touch-action:pan-y;
    inset:calc(58px + var(--safe-t)) calc(16px + var(--safe-r)) calc(12px + var(--safe-b)) calc(16px + var(--safe-l));
    color:#e8f4ff;font:14px/1.4 'Courier New','Microsoft YaHei',monospace}
  .modeContent{box-sizing:border-box;width:min(100%,720px);margin:auto;padding:clamp(12px,3%,24px);
    background:rgba(8,18,34,.94);border:1px solid #345572;border-radius:12px}
  .modeContent h1,.modeContent h2{margin:0 0 6px;font-size:clamp(21px,4vw,36px);line-height:1.1}
  .modeContent p{margin:0 0 12px;color:#b4cce2}
  .modeCards,.modeActions{display:grid;gap:8px}
  .modeActions{grid-template-columns:repeat(auto-fit,minmax(min(100%,100px),1fr));margin-top:10px}
  .wide-menu .modeCards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .wide-menu #recoveryCards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modeCard,.modeActions button,.modeContent select{box-sizing:border-box;min-height:44px;padding:8px 10px;
    color:#e8f4ff;background:#102944;border:1px solid #4e7595;border-radius:7px;font:inherit}
  button.modeCard,.modeActions button,.modeContent select{cursor:pointer}
  .modeCard{text-align:left}.modeCard strong{display:block;color:#91f0d3}
  .modeCard span{display:block;color:#c3d4e4;font-size:12px}
  .modeActions .primary{border-color:#59ffc8;color:#b6ffe9}
  #freeResultScreen{bottom:calc(28px + var(--safe-b) + min(16vh,50px))}
  #freeResultScreen .modeContent{margin:0 auto auto}
  #freeResultScreen h2{font-size:clamp(18px,3vw,27px)}
  #freeResultScreen p{font-size:13px}
  .landscape-results #freeResultScreen{
    inset:calc(8px + var(--safe-t)) calc(60px + var(--safe-r)) calc(100% - var(--result-bottom)) calc(60px + var(--safe-l));
    text-align:center
  }
  .landscape-results #freeResultScreen .modeContent{max-width:490px;padding:6px 8px}
  .landscape-results #freeResultScreen h2{font-size:18px;margin-bottom:3px}
  .landscape-results #freeResultScreen p{font-size:12px;margin-bottom:4px}
  .landscape-results #freeResultScreen .modeActions{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:4px}
  .landscape-results #freeResultScreen button{padding:4px;font-size:12px}
  .modeContent label{display:block;margin-top:8px}
  .modeContent select{display:block;width:100%;margin-top:4px}
  #gameViewport{--panel-surface:#111d29;--panel-border:#43606e;--panel-text:#d8e4e8;--instrument:#8ac3ca}
  #gameViewport :is(.modeScreen,#panel){font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:var(--panel-text)}
  #gameViewport :is(.modeContent,#panel){background:var(--panel-surface);border-color:var(--panel-border)}
  #gameViewport .modeContent h1{letter-spacing:0.09em;font-weight:650}
  #gameViewport .modeContent h2{font-weight:650}
  #gameViewport :is(.modeCard,.modeActions button,.modeContent select,.skinBtn){
    background:#1a2936;border-color:#486472;color:#d8e4e8
  }
  #gameViewport :is(.modeCard strong,.modeActions .primary){color:#a8d7d8}
  #gameViewport .modeActions .primary{border-color:#8ac3ca}
  #gameViewport .skinBtn.active{border-color:#8ac3ca;background:#274550}
  #gameViewport .iconBtn{background:rgba(13,25,34,.82);border-color:#6999a5;color:#c4dfe2}
  #gameViewport .tbtn.active{background:#2a5966}
  #gameViewport #btnT{color:#f2c588;border-color:#b38959}
  .modeContent button:focus-visible,.modeContent select:focus-visible{outline:2px solid #59ffc8;outline-offset:2px}
  .wide-menu .freeSelectors{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #freeCompatibility{margin:6px 0 0;color:#ffda91;font-size:12px}
  #directionModes{margin:0 0 12px;padding:0;border:0}
  #directionModes legend{margin-bottom:5px;color:#e8f4ff}
  #nativeLandscape{width:100%;margin-top:6px}
  .directionStatus{display:block;color:#bfe0ff;font-size:12px;line-height:1.4}
  #viewportDebug{position:absolute;z-index:70;top:calc(8px + var(--safe-t));left:50%;transform:translateX(-50%);
    max-width:calc(100% - 24px - var(--safe-l) - var(--safe-r));color:#e8f4ff;font:12px monospace}
  #viewportDebug[open]{width:420px;padding:8px;box-sizing:border-box;background:#0b1426;border:1px solid #56d9ff}
  #viewportDebug summary,#viewportDebug button{min-height:44px;padding:0 10px;line-height:44px;
    background:#0b1426;color:#e8f4ff;border:1px solid #56d9ff;border-radius:5px;cursor:pointer}
  #viewportDebug textarea{display:block;box-sizing:border-box;width:100%;
    height:min(var(--debug-height,140px),260px);margin:6px 0;color:inherit;background:#04060e;
    font:inherit;resize:none;user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
</style>
</head>
<body>
<div id="viewportHost">
<div id="safeArea" aria-hidden="true"></div>
<div id="gameViewport">
<canvas id="cv"></canvas>
<button type="button" class="iconBtn tbtn" id="btnL" aria-label="左转"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h12a4 4 0 0 1 0 8h-4M9 7l-5 5 5 5"/></svg></button>
<button type="button" class="iconBtn tbtn" id="btnR" aria-label="右转"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H8a4 4 0 0 0 0 8h4M15 7l5 5-5 5"/></svg></button>
<button type="button" class="iconBtn tbtn" id="btnT" aria-label="主引擎"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l7-7 7 7M5 19l7-7 7 7"/></svg></button>
<button type="button" class="iconBtn" id="gear" aria-label="参数设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3 3 1v3l2 2-2 2v3l-3 1-1 3H9l-1-3-3-1v-3l-2-2 2-2V7l3-1zM15 12a3 3 0 1 0-6 0 3 3 0 0 0 6 0"/></svg></button>
<button type="button" class="iconBtn" id="statsBtn" aria-label="航行统计"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 16v-5m5 5V7m5 9V4"/></svg></button>
<button type="button" class="iconBtn" id="pauseBtn" aria-label="暂停"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
<button type="button" class="iconBtn" id="homeBtn" aria-label="返回玩法" hidden>玩法</button>
<output id="menuVersion" hidden></output>
<section class="modeScreen" id="titleScreen" aria-labelledby="gameTitle" hidden>
  <div class="modeContent">
    <h1 id="gameTitle">VECTOR LANDER</h1>
    <p>矢量着陆 · 选择玩法</p>
    <div class="modeCards">
      <button type="button" class="modeCard" data-mode="campaign"><strong>太阳系战役</strong><span>十站航线 · 平台基础分 400 × 标示倍率</span></button>
      <button type="button" class="modeCard" data-mode="free"><strong>自由飞行</strong><span>自选场景和飞船 · 无限重试</span></button>
      <button type="button" class="modeCard" data-mode="recovery"><strong>回收挑战</strong><span>移动甲板着陆与双臂捕获</span></button>
    </div>
    <details id="quickFlight">
      <summary>操作与着陆条件</summary>
      <p>用左右键转向，按住上键或空格点火。触屏用左侧转向、右侧点火。松手后飞船仍会沿原方向运动。</p>
      <p>先在自由飞行练习。对准发光平台，保持直立，减小横移和下降速度。战役默认限制为横移 26、下降 36，安全倾角约 35°。</p>
      <p>海上回收看相对甲板速度。塔架挑战让火箭上部挂点进入双臂之间。各限制见挑战卡片。</p>
    </details>
  </div>
</section>
<section class="modeScreen" id="freeSetupScreen" aria-labelledby="freeTitle" hidden>
  <div class="modeContent">
    <h2 id="freeTitle">自由飞行</h2>
    <p>十个场景随时练习，飞行成绩与战役分开。</p>
    <div class="freeSelectors">
      <label for="freeScene">场景<select id="freeScene"></select></label>
      <label for="freeModel">飞船<select id="freeModel"></select></label>
    </div>
    <p id="freeCompatibility" role="status"></p>
    <div class="modeActions">
      <button type="button" data-action="home">返回玩法</button>
      <button type="button" class="primary" data-action="fly">开始飞行</button>
    </div>
  </div>
</section>
<section class="modeScreen" id="recoveryScreen" aria-labelledby="recoveryTitle" hidden>
  <div class="modeContent">
    <h2 id="recoveryTitle">回收挑战</h2>
    <div class="modeCards" id="recoveryCards"></div>
    <div class="modeActions"><button type="button" data-action="home">返回玩法</button></div>
  </div>
</section>
<section class="modeScreen" id="freeResultScreen" aria-labelledby="freeResultTitle" hidden>
  <div class="modeContent">
    <h2 id="freeResultTitle"></h2>
    <p id="freeResultInfo"></p>
    <div class="modeActions">
      <button type="button" class="primary" data-action="retry">再飞一次</button>
      <button type="button" data-action="free">更换场景或飞船</button>
      <button type="button" data-action="recovery" hidden>返回回收挑战</button>
      <button type="button" data-action="home">返回玩法</button>
    </div>
  </div>
</section>
<div id="rotateHint">
  <div class="rotPhone"></div>
  <div class="rotTitle">请横屏游玩</div>
  <div class="rotSub">先试着转动手机。页面仍是竖屏时，可开启兼容横屏再把手机横过来。</div>
  <button id="rotateTry" class="rotBtn">尝试原生全屏横屏</button>
  <button id="rotateCompat" class="rotBtn">开启兼容横屏</button>
  <button id="rotateSkip" class="rotBtn">竖屏也可</button>
  <output id="rotateStatus" class="directionStatus" aria-live="polite"></output>
</div>
<div id="panel" hidden>
  <div id="panelTitle">参数设置</div>
  <div id="missionActions" class="skinBtns" hidden>
    <button type="button" class="skinBtn" id="retryFree">重试本场</button>
    <button type="button" class="skinBtn" id="returnMission">返回本模式</button>
  </div>
  <fieldset id="directionModes">
    <legend>屏幕方向</legend>
    <div class="skinBtns">
      <button type="button" class="skinBtn active" data-direction="auto" aria-pressed="true">自动</button>
      <button type="button" class="skinBtn" data-direction="portrait" aria-pressed="false">竖屏</button>
      <button type="button" class="skinBtn" data-direction="compatible" aria-pressed="false">兼容横屏</button>
    </div>
    <button id="nativeLandscape" type="button" class="skinBtn">尝试原生全屏横屏</button>
    <output id="directionStatus" class="directionStatus" aria-live="polite"></output>
  </fieldset>
  <label class="qualitySetting">画质
    <select id="qualitySelect">
      <option value="auto">自动</option><option value="high">高</option>
      <option value="medium">中</option><option value="low">低</option>
    </select>
  </label>
  <div id="panelRows"></div>
  <div id="buildDetails"></div>
  <button id="copyBuild" class="skinBtn" type="button">复制版本信息</button>
  <span id="buildCopyStatus" role="status"></span>
  <textarea id="buildCopyField" aria-label="版本信息" readonly hidden></textarea>
  <div id="panelBtns">
    <button id="btnReset">恢复默认</button>
    <button id="btnClose">关闭 (G)</button>
  </div>
</div>
<details id="viewportDebug" hidden>
  <summary>屏幕诊断</summary>
  <textarea id="viewportDetails" aria-label="屏幕诊断信息" readonly></textarea>
  <button type="button" id="copyViewport">复制诊断</button>
  <span id="copyViewportStatus" role="status"></span>
</details>
</div>
</div>
<script>
'use strict';
/* ============================================================
   矢量着陆 Vector Lander — 太阳系航线版
   向 Spacewar!(1962) / Lunar Lander(1969/1979) / Asteroids(1979) 致敬
   纯 Canvas 手写物理：半隐式欧拉 + 牛顿引力 + 风/阻力/间歇泉，零依赖
   ============================================================ */

/* ---------- 工具函数 ---------- */
const TAU = Math.PI * 2;
const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const mod   = (a, n) => ((a % n) + n) % n;
const dist2 = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const angDiff = (a, b) => mod(a - b + Math.PI, TAU) - Math.PI;

/* ---------- 全局常量 ---------- */
const WORLD_W = 5200;
const TN = 1025;
const ALIGN_MIN = 0.82;
const NLV = 10;                       // 关卡总数

/* ---------- 可调参数（G/⚙ 面板实时调整，存档保留） ---------- */
const S_DEF = { gScale:0.9, thrust:44, burn:6, vyMax:36, vxMax:26, padW:1.2,
                spawnH:380, lives:4, trail:true, unlockAll:false, shake:true,
                skin:'classic', quality:'auto' };
const QUALITY = {
  high:{dpr:2,prediction:12,particleStride:1,detailStep:1},
  medium:{dpr:1.5,prediction:8,particleStride:2,detailStep:1.5},
  low:{dpr:1,prediction:6,particleStride:3,detailStep:2.3},
};
const qualityLevels = ['high','medium','low'];
let adaptiveLevel = 0, frameAverage = 16.7, qualitySamples = 0;
function renderQuality() { return QUALITY[S.quality==='auto' ? qualityLevels[adaptiveLevel] : S.quality]; }
const MODEL_KEYS = ['classic', 'falcon9', 'starship'];
let S = { ...S_DEF };
try {
  const cfg = JSON.parse(localStorage.getItem('vl_cfg') || '{}');
  if (cfg && typeof cfg === 'object')
    for (const k of Object.keys(S_DEF)) if (k in cfg) S[k] = cfg[k];
} catch (e) {}
// 设置档校验：数值限制在面板范围内，布尔仅接受 true/false；异常值回落默认
const CFG_NUM = {
  gScale:[0.3,1.5], thrust:[25,70,1], burn:[2,14], vyMax:[15,60,1],
  vxMax:[8,45,1], padW:[1,2.5], spawnH:[150,900,1], lives:[2,8,1]
};
for (const k in CFG_NUM) {
  const [a, b, int] = CFG_NUM[k], v = S[k];
  if (typeof v !== 'number' || !Number.isFinite(v)) S[k] = S_DEF[k];
  else S[k] = clamp(int ? Math.round(v) : v, a, b);
}
for (const k of ['trail', 'unlockAll', 'shake'])
  if (typeof S[k] !== 'boolean') S[k] = S_DEF[k];
// Retain the saved "skin" key and IDs from earlier versions.
if (S.quality!=='auto' && !qualityLevels.includes(S.quality)) S.quality=S_DEF.quality;
if (!MODEL_KEYS.includes(S.skin)) S.skin = S_DEF.skin;
function saveCfg() { try { localStorage.setItem('vl_cfg', JSON.stringify(S)); } catch (e) {} }

function loadJSON(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v || fallback; }
  catch (e) { return fallback; }
}
function saveJSON(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

/* ---------- 存档：最佳分 / 星级进度 / 统计 ---------- */
function loadBest() {
  try {
    const v = +(localStorage.getItem('vl_best') || 0);
    return Number.isFinite(v) && v > 0 ? Math.floor(v) : 0;
  } catch (e) { return 0; }
}
function saveBest() { try { localStorage.setItem('vl_best', String(best)); } catch (e) {} }
let best = loadBest();

const progress = Object.assign({ stars: Array(NLV).fill(0), unlocked: 0 },
                                loadJSON('vl_progress', {}));
if (!Array.isArray(progress.stars) || progress.stars.length !== NLV)
  progress.stars = Array(NLV).fill(0);
// 星级校验：仅接受 0..3 的有限数字，取整；异常/缺项回落 0
progress.stars = Array.from({ length: NLV }, (_, i) => {
  const s = progress.stars[i];
  return typeof s === 'number' && Number.isFinite(s) ? clamp(Math.floor(s), 0, 3) : 0;
});
// 解锁进度校验：仅接受有限数字，取整并限制在 0..NLV-1；异常值回落 0
if (typeof progress.unlocked !== 'number' || !Number.isFinite(progress.unlocked))
  progress.unlocked = 0;
else
  progress.unlocked = clamp(Math.floor(progress.unlocked), 0, NLV - 1);
function saveProgress() { saveJSON('vl_progress', progress); }

const stats = Object.assign({ landings:0, crashes:0, perfects:0 }, loadJSON('vl_stats', {}));
// 统计校验：三项都必须是有限非负整数，异常值回落 0
for (const k of ['landings', 'crashes', 'perfects']) {
  const v = stats[k];
  stats[k] = typeof v === 'number' && Number.isFinite(v) && v >= 0 ? Math.floor(v) : 0;
}
function saveStats() { saveJSON('vl_stats', stats); }

/* ---------- 画布 ---------- */
const cvs = document.getElementById('cv');
const ctx = cvs.getContext('2d');
const viewportHost = document.getElementById('viewportHost');
const viewport = document.getElementById('gameViewport');
const insetProbe = document.getElementById('safeArea');
const visual = window.visualViewport;
const landscapeQuery = matchMedia('(orientation: landscape)');
const coarseQuery = matchMedia('(pointer: coarse)');
const debugPanel = document.getElementById('viewportDebug');
const launchParams = new URLSearchParams(location.search);
const debugEnabled = launchParams.get('debug') === '1';
const viewportEvents = [];
let lastDebugUpdate = 0;
let viewportDirty = true, viewportTimer = 0;
let requestedW = 0, requestedH = 0, requestedX = 0, requestedY = 0;
let hostW = 0, hostH = 0, virtualLandscape = false;
let lastWindowWidth = 0, lastVisualWidth = 0, preferVisual = true;
let wantsRotateHint = true, directionMode = 'auto';
let nativeBusy = false, ownsFullscreen = false, ownsOrientationLock = false;
let nativeAttempt = 0, nativeTimer = 0, nativeStatus = '';
let W = 0, H = 0, DPR = 1, vig = null, safeTop = 0, safeBottom = 0, safeLeft = 0, safeRight = 0;
let stars = [];

function genStars() {
  stars = [];
  const layers = [
    { f: 0.10, n: W * H / 16000, s: 1.0, a: 0.5 },
    { f: 0.28, n: W * H / 13000, s: 1.4, a: 0.8 },
    { f: 0.55, n: W * H / 26000, s: 2.0, a: 1.0 },
  ];
  for (const L of layers)
    for (let i = 0; i < L.n; i++)
      stars.push({ x: rand(0, W + 2400), y: rand(0, H + 2400),
                   f: L.f, s: L.s * rand(0.6, 1.2), a: L.a * rand(0.4, 1) });
}
function resize() {
  // A zoomed visual viewport describes a crop, so keep the layout stable while zoomed.
  const visualReady = visual && Math.abs(visual.scale - 1) < 0.01 &&
    visual.width > 0 && visual.height > 0;
  const windowWidth = window.innerWidth, windowHeight = window.innerHeight;
  const visualWidth = visualReady ? Math.round(visual.width) : 0;
  const visualHeight = visualReady ? Math.round(visual.height) : 0;
  if (visualReady) {
    // Orientation events may arrive before one of the two viewport measurements.
    if ((windowWidth >= windowHeight) === (visualWidth >= visualHeight)) preferVisual = true;
    else if (visualWidth !== lastVisualWidth && windowWidth === lastWindowWidth) preferVisual = true;
    else if (windowWidth !== lastWindowWidth && visualWidth === lastVisualWidth) preferVisual = false;
  }
  lastWindowWidth = windowWidth;
  lastVisualWidth = visualWidth;
  const useVisual = visualReady && preferVisual;
  const offeredW = useVisual ? visualWidth : windowWidth;
  const offeredH = useVisual ? visualHeight : windowHeight;
  if (offeredW <= 0 || offeredH <= 0) return;
  const x = useVisual ? visual.offsetLeft : 0;
  const y = useVisual ? visual.offsetTop : 0;
  // Adaptive detail leaves the backing store intact. Explicit quality changes raster density.
  const dpr = Math.min(S.quality==='auto' ? QUALITY.high.dpr : renderQuality().dpr, window.devicePixelRatio || 1);
  const hostChanged = offeredW !== requestedW || offeredH !== requestedH || x !== requestedX || y !== requestedY;
  const unobservedChange = typeof ResizeObserver !== 'function' &&
    (viewportHost.clientWidth !== hostW || viewportHost.clientHeight !== hostH);
  if (!viewportDirty && !hostChanged && !unobservedChange && dpr === DPR) return;
  if (hostChanged) {
    requestedW = offeredW; requestedH = offeredH; requestedX = x; requestedY = y;
    viewportHost.style.left = x + 'px'; viewportHost.style.top = y + 'px';
    viewportHost.style.width = offeredW + 'px'; viewportHost.style.height = offeredH + 'px';
  }
  viewportDirty = false;
  const previousHostLandscape = hostW >= hostH;
  hostW = viewportHost.clientWidth; hostH = viewportHost.clientHeight;
  if (!hostW || !hostH) return;
  const hostLandscape = hostW >= hostH;
  const rotate = directionMode === 'compatible' && !hostLandscape;
  const boxed = directionMode === 'portrait' && hostLandscape;
  const w = rotate ? hostH : boxed ? Math.round(hostH * 0.75) : hostW;
  const h = rotate ? hostW : hostH;
  const left = boxed ? Math.floor((hostW - w) / 2) : 0;
  const geometryChanged=w!==W || h!==H;
  const resized = geometryChanged || dpr !== DPR;
  if (W && (rotate !== virtualLandscape || (w >= h) !== (W >= H) || hostLandscape !== previousHostLandscape)) {
    cancelViewportInput();
    scheduleInsetRefresh();
  }
  virtualLandscape = rotate;
  viewport.classList.toggle('virtual-landscape', rotate);
  viewport.classList.toggle('compact-hint', h < 440);
  viewport.style.setProperty('--host-width', hostW + 'px');
  viewport.style.left = left + 'px';
  viewport.style.width = w + 'px'; viewport.style.height = h + 'px';
  W = w; H = h; DPR = dpr;
  const insets = getComputedStyle(insetProbe);
  const top = parseFloat(insets.paddingTop) || 0;
  const bottom = parseFloat(insets.paddingBottom) || 0;
  const physicalLeft = parseFloat(insets.paddingLeft) || 0;
  const physicalRight = parseFloat(insets.paddingRight) || 0;
  safeTop = rotate ? physicalRight : top;
  safeRight = rotate ? bottom : Math.max(0, physicalRight - (hostW - w - left));
  safeBottom = rotate ? physicalLeft : bottom;
  safeLeft = rotate ? top : Math.max(0, physicalLeft - left);
  viewport.style.setProperty('--safe-t', safeTop + 'px');
  viewport.style.setProperty('--safe-r', safeRight + 'px');
  viewport.style.setProperty('--safe-b', safeBottom + 'px');
  viewport.style.setProperty('--safe-l', safeLeft + 'px');
  viewport.classList.toggle('landscape-results', W>H);
  viewport.style.setProperty('--result-bottom', H/2+'px');
  viewport.classList.toggle('wide-menu', W >= H && W - safeLeft - safeRight >= 508);
  document.body.classList.toggle('touch-ui', touchUI());
  if (resized) {
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    vig = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,10,0.55)');
    if (geometryChanged) genStars();
  }
  if (debugEnabled) debugPanel.style.setProperty('--debug-height', Math.max(48, H - safeTop - safeBottom - 126) + 'px');
  syncOrientationHint();
}
function scheduleInsetRefresh() {
  clearTimeout(viewportTimer);
  viewportTimer = setTimeout(() => { viewportDirty = true; }, 400);
}
function recordViewportEvent(label) {
  if (!debugEnabled) return;
  viewportEvents.unshift(Math.round(performance.now()) + 'ms ' + label +
    ' · window ' + innerWidth + '×' + innerHeight +
    (visual ? ' · visual ' + Math.round(visual.width) + '×' + Math.round(visual.height) : ''));
  viewportEvents.length = Math.min(12, viewportEvents.length);
}
function invalidateViewport(label, directionChanged = false) {
  viewportDirty = true;
  if (directionChanged) cancelViewportInput();
  scheduleInsetRefresh();
  recordViewportEvent(label);
}
function listenViewport(target, type, label, directionChanged = false) {
  if (!target) return;
  const onChange = () => invalidateViewport(label, directionChanged);
  if (target.addEventListener) target.addEventListener(type, onChange, {passive:true});
  else if (type === 'change') target.addListener?.(onChange);
}
function cancelViewportInput() {
  canvasTap = null;
  touchSelection = null;
  releaseAllKeys();
}
function touchUI() {
  return coarseQuery.matches || directionMode === 'compatible';
}
function syncOrientationHint() {
  if (hostW >= hostH) wantsRotateHint = false;
  const show = directionMode === 'auto' && touchUI() && H > W && wantsRotateHint;
  document.body.classList.toggle('rotate-hint', show);
  const blocked = show && state !== 'title' && state !== 'map';
  if (blocked && !rotatePaused) cancelViewportInput();
  rotatePaused = blocked;
}

/* ---------- 音频（程序化合成，无素材） ---------- */
let AC = null, master = null, noiseBuf = null, noiseGain = null, engineLP = null;
let ambSrc = null, ambFilter = null, ambGain = null, pendingAmb = null;
let muted = false;

function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.5;
    master.connect(AC.destination);
    const len = AC.sampleRate; noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // 主引擎
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    engineLP = AC.createBiquadFilter(); engineLP.type = 'lowpass'; engineLP.frequency.value = 260;
    noiseGain = AC.createGain(); noiseGain.gain.value = 0;
    src.connect(engineLP); engineLP.connect(noiseGain); noiseGain.connect(master); src.start();
    // 环境音（按天体）
    ambSrc = AC.createBufferSource(); ambSrc.buffer = noiseBuf; ambSrc.loop = true;
    ambFilter = AC.createBiquadFilter(); ambFilter.type = 'bandpass'; ambFilter.frequency.value = 200;
    ambGain = AC.createGain(); ambGain.gain.value = 0;
    ambSrc.connect(ambFilter); ambFilter.connect(ambGain); ambGain.connect(master); ambSrc.start();
    if (pendingAmb) setAmbience(pendingAmb);
  } catch (e) { AC = null; }
}
function setAmbience(a) {
  pendingAmb = a;
  if (!AC || !ambGain) return;
  const t = AC.currentTime;
  if (a) {
    ambFilter.type = a.f < 130 ? 'lowpass' : 'bandpass';
    ambFilter.frequency.setTargetAtTime(a.f, t, 0.4);
    ambGain.gain.setTargetAtTime(muted ? 0 : a.g, t, 0.6);
  } else ambGain.gain.setTargetAtTime(0, t, 0.4);
}
function setThrustSound(on) {
  if (!AC) return;
  noiseGain.gain.setTargetAtTime(on ? 0.22 : 0, AC.currentTime, 0.06);
}
function sfxBeep(freq, dur, type, vol, slideTo) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  g.gain.setValueAtTime(vol || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function sfxExplosion() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(1000, t); f.frequency.exponentialRampToValueAtTime(110, t + 0.6);
  g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + 0.75);
  sfxBeep(130, 0.5, 'sine', 0.30, 42);
}
function sfxLand() {
  sfxBeep(660, 0.12, 'sine', 0.16);
  setTimeout(() => sfxBeep(880, 0.16, 'sine', 0.16), 130);
}

/* ---------- 地形生成（中点位移） ---------- */
function genTerrain(lv) {
  const h = new Float32Array(TN);
  const base = 1060, amp = 240 * lv.rough;
  h[0] = base + rand(-amp, amp) * 0.6;
  h[TN-1] = base + rand(-amp, amp) * 0.6;
  let step = TN - 1, delta = amp;
  while (step > 1) {
    const half = step >> 1;
    for (let i = half; i < TN - 1; i += step)
      h[i] = (h[i - half] + h[i + half]) / 2 + rand(-delta, delta);
    step = half; delta *= 0.58;
  }
  for (let i = 0; i < TN; i++) h[i] = clamp(h[i], 520, 1400);

  const st = WORLD_W / (TN - 1);
  pads = [];
  // 漂移平台没有 x1/x2，用基准中心 ± amp 计算完整漂移包络，避免重叠检测失效
  const padSpan = p => {
    if (p.moving) return [p.cx - p.amp - p.w/2, p.cx + p.amp + p.w/2];
    return [p.x1, p.x2];
  };
  const overlaps = (x1, x2) => pads.some(p => {
    const [a, b] = padSpan(p);
    return Number.isFinite(a) && Number.isFinite(b) &&
           x1 < b + 140 && x2 > a - 140;
  });
  for (const spec of lv.pads) {
    const w = spec.w * S.padW;
    const reach = spec.amp || 0;
    let cx, tries = 0;
    if (spec.peak) {
      let bi = Math.floor(TN * 0.25), bv = 1e9;
      for (let i = Math.floor(TN*0.2); i < TN*0.8; i++)
        if (h[i] < bv) { bv = h[i]; bi = i; }
      cx = bi * st;
    } else {
      do { cx = rand(600, WORLD_W - 600); tries++; }
      while (overlaps(cx - w/2 - reach, cx + w/2 + reach) && tries < 20);
    }
    const x1 = cx - w/2, x2 = cx + w/2;
    const i1 = clamp(Math.round(x1/st), 2, TN-3), i2 = clamp(Math.round(x2/st), i1+1, TN-3);
    let y = 0; for (let i = i1; i <= i2; i++) y += h[i];
    y /= (i2 - i1 + 1);
    for (let i = i1; i <= i2; i++) h[i] = y;
    for (let k = 1; k <= 5; k++) {
      const f = k / 6;
      if (i1 - k >= 0)    h[i1-k] = h[i1-k] * (1-f) + y * f;
      if (i2 + k < TN)    h[i2+k] = h[i2+k] * (1-f) + y * f;
    }
    if (lv.driftPads && spec.amp) {
      pads.push({ moving:true, cx, w, m: spec.m, amp: spec.amp, spd: spec.spd, phase: rand(0, TAU) });
    } else {
      pads.push({ x1: i1*st, x2: i2*st, y, m: spec.m, w });   // w 必须有：新绘制函数按宽度取值
    }
  }
  terrain = { h, step: st };
}
function heightAt(x) {
  const f = clamp(x, 0, WORLD_W - 0.01) / terrain.step;
  const i = Math.floor(f), fr = f - i;
  return terrain.h[i] * (1 - fr) + terrain.h[Math.min(i+1, TN-1)] * fr;
}

/* ---------- 间歇泉（木卫一） ---------- */
function genGeysers(n) {
  geysers = [];
  const centers = pads.map(p => p.moving ? p.cx : (p.x1 + p.x2) / 2)
                      .filter(Number.isFinite);
  let placed = 0, guard = 0;
  while (placed < n && guard++ < 200) {
    const gx = rand(500, WORLD_W - 500);
    if (centers.some(c => Math.abs(gx - c) < 450)) continue;
    if (geysers.some(g => Math.abs(g.x - gx) < 700)) continue;
    geysers.push({ x:gx, y:heightAt(gx)-4, w:70, h:430, f:250,
                   period:6.5, phase:rand(0, 6.5), activeDur:1.7, warnDur:1.2 });
    placed++;
  }
}
function geyserState(g, t) {
  const c = mod(t + g.phase, g.period);
  return c < g.activeDur ? 'active' : (c > g.period - g.warnDur ? 'warn' : 'idle');
}

/* ---------- 岩柱（地形三角尖柱 / 火卫一径向版本） ---------- */
function genSpires(n) {
  spires = [];
  const centers = pads.map(p => padCX(p, 0)).filter(v => Number.isFinite(v));
  let guard = 0;
  while (spires.length < n && guard++ < 200) {
    if (levelDef.type === 'planetoid') {
      const ang = rand(0, TAU);
      if (Math.abs(angDiff(ang, -Math.PI/2)) < 0.8) continue;       // 避开顶部平台
      if (spires.some(s => Math.abs(angDiff(ang, s.ang)) < 0.8)) continue;
      spires.push({ ang, h: rand(150, 240), w: rand(30, 50), radial:true });
    } else {
      const sx = rand(500, WORLD_W - 500);
      if (centers.some(c => Math.abs(sx - c) < 520)) continue;      // 出生走廊净空
      if (geysers.some(g => Math.abs(sx - g.x) < 300)) continue;
      if (spires.some(s => Math.abs(sx - s.x) < 320)) continue;
      const base = heightAt(sx);
      spires.push({ x:sx, base, top: base - rand(180, 320), w: rand(30, 60) });
    }
  }
}

/* ---------- 陨石（慢速漂移，绝不生成在平台附近） ---------- */
function genAsteroids(n) {
  asteroids = [];
  for (let i = 0; i < n; i++) {
    const r = rand(14, 26), verts = [];
    for (let k = 0; k < 10; k++) verts.push(r * rand(0.72, 1.18));
    let x, tries = 0;
    do { x = rand(0, WORLD_W); tries++; }
    while (tries < 40 && pads.some(p => {
      const c = p.moving ? p.cx : (p.x1 + p.x2) / 2;
      return Number.isFinite(c) && Math.abs(x - c) < 550;
    }));
    asteroids.push({ x, y: rand(320, 820), r, verts,
                     rot: rand(0, TAU), vr: rand(-0.4, 0.4),
                     vx: (rand(0,1)<0.5?-1:1) * rand(2, 6), vy: rand(-2, 2) });
  }
}
function moveAsteroid(a, dt) {
  a.x += a.vx * dt;
  if (a.x < -120) a.x += WORLD_W + 240;
  else if (a.x > WORLD_W + 120) a.x -= WORLD_W + 240;
  a.y += a.vy * dt;
  if (a.y < 260 || a.y > 980) { a.vy *= -1; a.y = clamp(a.y, 260, 980); }
}
function updateAsteroids(dt) {
  for (const a of asteroids) {
    moveAsteroid(a, dt);
    a.rot += a.vr * dt;
  }
}

/* ---------- 陨石雨（红色预警线 → 天顶坠落） ---------- */
function updateMeteors(dt) {
  const md = levelDef.meteors;
  if (!md) return;
  if (time >= meteorNext) {
    meteorNext = time + md.period;
    const n = Math.round(rand(md.min, md.max));
    const centers = pads.map(p => padCX(p, 0)).filter(v => Number.isFinite(v));
    for (let k = 0; k < n; k++) {
      let wx, tries = 0;
      do { wx = rand(100, WORLD_W - 100); tries++; }
      while (tries < 20 && centers.some(c => Math.abs(wx - c) < 130));
      meteorWarnings.push({ x: wx, until: time + md.warn });
      meteorQueue.push({ x: wx, at: time + md.warn, vy: rand(md.vy[0], md.vy[1]) });
    }
  }
  for (let i = meteorWarnings.length - 1; i >= 0; i--)
    if (time > meteorWarnings[i].until) meteorWarnings.splice(i, 1);
  for (let i = meteorQueue.length - 1; i >= 0; i--) {
    const m = meteorQueue[i];
    if (time >= m.at) {
      meteors.push({ x: m.x + rand(-8, 8), y: -80, vy: m.vy, r: METEOR_R });
      meteorQueue.splice(i, 1);
    }
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.y += m.vy * dt;
    if (m.y > 1600) { meteors.splice(i, 1); continue; }
    if (state !== 'playing') continue;
    for (const p of shipWorldPts())
      if (dist2(p.x, p.y, m.x, m.y) < METEOR_R) { crash('陨石雨撞击'); return; }
  }
}
/* ---------- 沙尘暴粒子（爆发期全屏沙流） ---------- */
function spawnStormDust(dt) {
  const ds = levelDef.duststorm;
  const c = mod(time + ds.phase0, ds.period);
  if (c < ds.calm + ds.warn) return;
  if (particles.length > 650 || Math.random() > dt * 70) return;
  const v = viewBounds();
  const dir = (Math.floor((time + ds.phase0) / ds.period) % 2) ? 1 : -1;
  particles.push({ x: rand(v.l, v.r), y: rand(v.t, v.b),
    vx: dir * rand(150, 260), vy: rand(-15, 15),
    life: 1.1, max: 1.1, kind: 'sand' });
}

/* ---------- 平台位置（浮空平台随时间漂移） ---------- */
function padCX(p, t) {
  if (p.marine) return deckPose(p,t).x;
  if (p.moving) return p.cx + p.amp * Math.sin(t * p.spd + p.phase);
  if (p.x1 !== undefined) return (p.x1 + p.x2) / 2;
  return NaN;                                  // 行星弧形平台无水平中心
}
function padY(p, t) {
  if (p.marine) return deckPose(p,t).y;
  if (p.moving && terrain) return heightAt(padCX(p, t)) - 2;   // 冰筏贴着冰面滑移
  return p.y;
}

/* ---------- 关卡装载 ---------- */
function loadLevel(i) {
  levelIdx = isRecovery() ? -1 : i; levelDef = isTower() ? TOWER : isRecovery() ? OCEAN : LEVELS[i];
  if (levelDef.duststorm) levelDef = { ...levelDef, duststorm:{ ...levelDef.duststorm } };
  particles = []; frags = []; banner = null; landPad = null;
  trail = []; trailT = 0;
  P = null; terrain = null; pads = []; geysers = [];
  if (isTower()) pads=[{cx:WORLD_W/2,x1:WORLD_W/2-16,x2:WORLD_W/2+16,y:960,w:32}];
  else if (isRecovery()) {
    pads = [{marine:true, moving:true, w:OCEAN.deckWidth, y:980, epoch:time, m:1}];
  } else if (levelDef.type === 'terrain') {
    genTerrain(levelDef);
    if (levelDef.geysers) genGeysers(levelDef.geysers);
  } else if (levelDef.type === 'planetoid') {
    P = { cx: WORLD_W/2, cy: 980, R: levelDef.R, craters: [] };
    for (let k = 0; k < 6; k++) {
      const ang = rand(0, TAU), d = rand(0, 0.72 * P.R);
      P.craters.push({ x: P.cx + Math.cos(ang)*d, y: P.cy + Math.sin(ang)*d, r: rand(9, 28) });
    }
    pads = levelDef.pads.map(p => ({ ...p }));
  } else if (levelDef.type === 'float') {
    pads = levelDef.pads.map(p => ({ ...p, w: Math.round(p.w * S.padW),
                                     moving:true, phase: rand(0, TAU) }));
  }
  spires = []; meteors = []; meteorWarnings = []; meteorQueue = [];
  if (levelDef.spires) genSpires(levelDef.spires);
  genAsteroids(levelDef.ast);
  if (levelDef.duststorm) levelDef.duststorm.phase0 = rand(0, levelDef.duststorm.period);
  stormPhase0 = rand(0, 16);
  meteorNext = time + 3;
  spawnShip(1.2);
  camFollow(0, true);
  setAmbience(levelDef.amb);

}
function spawnShip(introSeconds=0) {
  predictionDue = -Infinity;
  ship.visible = true; ship.flame = 0; ship.thrusting = false; landPad = null; trail = [];
  ship.modelId = activeMission?.modelId ?? S.skin;
  ship.spin = 0;
  ship.fuelCapacity = Math.round(levelDef.fuel * currentModel().tank);
  ship.fuel = ship.fuelCapacity;
  placeShip();
  const defaultFlight=activeMission && !isFreeFlight() &&
    ['spawnH','gScale','padW','vxMax','vyMax'].every(key=>S[key]===S_DEF[key]);
  if(!defaultFlight) return;
  for(let retry=0;retry<6;retry++){
    if(idleOutcome(ship,time,introSeconds)==='failure') return;
    if(isRecovery()) ship.x+=(isTower()?4:-9);
    else placeShip();
  }
  // Keep the accessible initial position. With the controls untouched this
  // attitude falls outside every legal pad normal and recovery angle.
  placeShip();
  ship.a=isRecovery()?0.35:1;
}
function placeShip() {
  if (isTower()) {
    ship.x=pads[0].cx+25; ship.y=pads[0].y-S.spawnH; ship.vx=-2; ship.vy=16; ship.a=0;
  } else if (isRecovery()) {
    const deck = deckPose(pads[0],time);
    ship.x = deck.x - 74; ship.y = deck.y - S.spawnH;
    ship.vx = 9; ship.vy = 18; ship.a = 0;
  } else if (levelDef.type === 'planetoid') {
    ship.x = P.cx + 650; ship.y = P.cy - 600;
    ship.vx = 0; ship.vy = 15;
    const dx = P.cx - ship.x, dy = P.cy - ship.y, d = Math.hypot(dx, dy);
    ship.a = Math.atan2(dx/d, -(dy/d));
  } else if (levelDef.type === 'float') {
    const p0 = pads[pads.length - 1] || pads[0];   // 出生在最大的平台上方
    ship.x = clamp(padCX(p0, time) + rand(-200, 200), 100, WORLD_W - 100);
    ship.y = p0.y - S.spawnH;
    ship.vx = rand(-14, 14); ship.vy = 18; ship.a = 0;
  } else {
    const pad = pads[Math.floor(Math.random() * pads.length)];
    const pcx = padCX(pad, time);
    ship.x = clamp(pcx + rand(-450, 450), 60, WORLD_W - 60);
    ship.y = Math.min(padY(pad, time) - S.spawnH, heightAt(ship.x) - 150);
    ship.vx = rand(-20, 20); ship.vy = 18; ship.a = 0;
  }
}

  if (!mission || (!MODEL_KEYS.includes(chosenModel) && !(mission.mode==='recovery' && chosenModel==='superheavy'))) return false;
  const campaign = mission.mode === 'campaign';
  const recovery = mission.mode === 'recovery';
  if (recovery && (!RECOVERY_MISSIONS.some(m=>m.modelId===chosenModel) || chosenModel !== mission.modelId)) return false;
  if (!campaign && !recovery && (mission.mode !== 'free' || !mission.models.includes(chosenModel))) return false;
  if (campaign && chosenModel !== mission.modelId) return false;
  if (campaign && !(S.unlockAll || mission.levelIndex <= progress.unlocked)) {
    announce('站点未解锁', '需先通关前一站', '#ffd75e', 1.6);

  if (panelOpen) togglePanel();
  activeMission = {...mission, modelId:chosenModel};
  missionResult = null;

  sfxBeep(440, 0.1, 'square', 0.12, 660);

}

  return model.dryMass + model.fuelMass * clamp(body.fuel / body.fuelCapacity, 0, 1);
}
function turnShip(body, model, left, right, dt) {
  if (!model.moment) {
    // Preserve direct rotation and operation order for the classic craft.
    if (left) body.a -= model.turnRate * dt;
    if (right) body.a += model.turnRate * dt;
    return;
  }
  const command = Number(right) - Number(left);
  if (!command && !body.spin) return;
  const moment = model.moment * vehicleMass(body, model) / model.dryMass;
  const step = model.torque / moment * dt;
  body.spin += clamp(command * model.turnRate - body.spin, -step, step);
  body.a += body.spin * dt;
}
function fireEngine(body, model, dt) {
  const acceleration = S.thrust * model.thrust / vehicleMass(body, model);
  body.fuel = Math.max(0, body.fuel - S.burn * model.burn * dt);
  body.vx += Math.sin(body.a) * acceleration * dt;
  body.vy -= Math.cos(body.a) * acceleration * dt;
}
function lowFuel(body = ship) {
  return body.fuel < 22 * (body.fuelCapacity / levelDef.fuel);
}

function shipPt(px, py) {
  const c = Math.cos(ship.a), s = Math.sin(ship.a);
  return [ship.x + px*c - py*s, ship.y + px*s + py*c];
}
function shipWorldPts(body = ship, points = []) {
  const c = Math.cos(body.a), s = Math.sin(body.a);
  const model=currentModel(body), offsets=model.pts;
  points.length = offsets.length;
  for (let i = 0; i < offsets.length; i++) {
    const [px, py] = offsets[i];
    const p = points[i] || (points[i] = {});
    p.x = body.x + px*c - py*s;
    p.y = body.y + px*s + py*c;
    p.foot = py===model.landingOffset || (body.modelId==='classic' && py===7);

function noseDir() { return { x: Math.sin(ship.a), y: -Math.cos(ship.a) }; }

/* ---------- 环境力（引力 + 侧风/风暴周期 + 大气阻力 + 沙尘暴 + 间歇泉）
   物理与轨迹预测共用 ---------- */
function windAt(t) {
  if (isRecovery() && !isTower()) t -= pads[0].epoch;
  const w = levelDef.wind;
  if (!w) return 0;
  let m = 1;
  if (levelDef.stormCycle) {                     // 风暴周期：平静→增强→狂风
    const c = mod(t + stormPhase0, 16);
    m = c < 8 ? 0.3 : c < 11 ? 0.6 : 1.0;
  }
  return (w.base + w.gust * Math.sin(t * 0.55)) * m;
}
function envForces(o, dt, t) {
  if (levelDef.type === 'planetoid') {
    const dx = P.cx - o.x, dy = P.cy - o.y, r = Math.max(Math.hypot(dx, dy), P.R*0.85);
    const a = (levelDef.GM * S.gScale) / (r*r);
    o.vx += dx/r * a * dt; o.vy += dy/r * a * dt;
  } else o.vy += levelDef.g * S.gScale * dt;
  o.vx += windAt(t) * dt;
  const ds = levelDef.duststorm;
  if (ds) {                                      // 沙尘暴爆发期横向推力（有 2s 预警）
    const c = mod(t + ds.phase0, ds.period);
    if (c >= ds.calm + ds.warn)
      o.vx += ds.force * (Math.floor((t + ds.phase0) / ds.period) % 2 ? 1 : -1) * dt;
  }
  if (levelDef.drag) { const k = Math.exp(-levelDef.drag * dt); o.vx *= k; o.vy *= k; }
  for (const g of geysers) {
    if (geyserState(g, t) !== 'active') continue;
    const dx = o.x - g.x;
    if (Math.abs(dx) < g.w && o.y > g.y - g.h && o.y < g.y + 20)
      o.vy -= g.f * (1 - Math.abs(dx)/g.w) * dt;
  }
}

/* ---------- 轨迹预测（含风/阻力/间歇泉/移动平台） ---------- */

let predictionDue = -Infinity;
function computePrediction() {
  const pts = [], hull = [], previous={};
  let impact = null;
  const sim = { x:ship.x, y:ship.y, vx:ship.vx, vy:ship.vy, a:ship.a, spin:ship.spin,
                modelId:ship.modelId, fuel:ship.fuel, fuelCapacity:ship.fuelCapacity };
  const model = currentModel(sim);
  const rocks = asteroids.map(a => ({...a}));
  const rain = meteors.map(m => ({...m}));
  const queued = meteorQueue.map(m => ({...m, y:-80, r:METEOR_R}));
  const left = keys.left, right = keys.right, thrust = keys.up;
  const solidHazards=rocks.length>0 || spires.length>0;
  // 小步长与实际飞行一致。低重力或高空时延长视距，最多 24 秒。
  const height = terrain ? heightAt(sim.x) - sim.y :
    P ? dist2(sim.x, sim.y, P.cx, P.cy) - P.R : Math.abs(padY(pads[0],time) - sim.y);
  const gravity = Math.max(1, (P ? levelDef.GM / (P.R*P.R) : levelDef.g) * S.gScale);
  const descent = P ? ((P.cx - sim.x)*sim.vx + (P.cy - sim.y)*sim.vy) /
    Math.max(1, height + P.R) : sim.vy;
  const eta = (Math.sqrt(descent*descent + 2*gravity*Math.max(0,height)) - descent) / gravity;
  const horizon = clamp(eta + 2, 4, 24);
  const steps = Math.ceil(horizon / FIXED);
  const stride = Math.ceil(steps / 64);
  const meteorHit = (m, p) => m.y <= 1600 && dist2(p.x, p.y, m.x, m.y) < METEOR_R;
  for (let i = 1; i <= steps; i++) {
    const t = time + i*FIXED;
    for (const m of rain) m.y += m.vy*FIXED;
    for (const m of queued) if (t >= m.at) m.y += m.vy*FIXED;
    if (rain.length || queued.length) {
      // 陨石雨先更新，再执行本步的船体物理。排队陨石以预警中心估算。
      const hit = shipWorldPts(sim, hull).find(p =>
        rain.some(m => meteorHit(m, p)) || queued.some(m => t >= m.at && meteorHit(m, p)));
      if (hit) { impact = {x:hit.x,y:hit.y}; break; }
    }
    previous.x=sim.x;previous.y=sim.y;previous.a=sim.a;
    turnShip(sim, model, left, right, FIXED);
    if (thrust && sim.fuel > 0) fireEngine(sim, model, FIXED);
    const boundary=advanceBody(sim,FIXED,t);
    if(boundary){
      if(boundary==='cloud') impact={x:sim.x,y:sim.y};
      break;
    }
    if (i % stride === 0) pts.push({x:sim.x, y:sim.y});
    for (const rock of rocks) moveAsteroid(rock, FIXED);
    shipWorldPts(sim, hull);
    const obstacle = solidHazards && hull.find(p => rocks.some(a => dist2(p.x,p.y,a.x,a.y) < a.r*0.72) ||
                                   spires.some(s => hitsSpire(s, p)));
    const hit = obstacle || findContact(hull, t, sim, previous)?.pt;
    if (hit) { impact = {x:hit.x,y:hit.y}; break; }
  }
  pred = { pts, impact };
}

/* ---------- 碰撞与着陆判定 ---------- */
// Derivatives use the same phase as the drawn deck. Positive normal speed means closing.
function deckPose(p,t) {
  const age = t-p.epoch, drift = age*0.21, swell = age*0.82, roll = age*0.69;
  const angle = 0.055*Math.sin(roll);
  return {x:WORLD_W/2 + 66*Math.sin(drift), y:p.y + 7*Math.sin(swell),
    vx:13.86*Math.cos(drift), vy:5.74*Math.cos(swell),
    angle, omega:0.055*0.69*Math.cos(roll), c:Math.cos(angle), s:Math.sin(angle)};
}
function waterY(x,t) {
  const age = t-pads[0].epoch, phase = (x-WORLD_W/2)*0.015;
  return pads[0].y + 23 + 7*Math.sin(age*0.82-phase) + 2*Math.sin(2*phase-age*1.31);
}
function deckApproach(body,deck) {
  const dx=body.x-deck.x, dy=body.y-deck.y;
  const along=dx*deck.c + dy*deck.s, depth=dy*deck.c-dx*deck.s;
  const angle=angDiff(body.a,deck.angle);
  // Velocity at the centre of the landing feet relative to the deck point underneath.
  const footX=-Math.sin(body.a)*SHIP_MODELS.falcon9.landingOffset;
  const footY=Math.cos(body.a)*SHIP_MODELS.falcon9.landingOffset;
  const footAlong=along+footX*deck.c+footY*deck.s;
  const vx=body.vx-footY*body.spin-deck.vx, vy=body.vy+footX*body.spin-deck.vy;
  return {along, altitude:-(depth+footY*deck.c-footX*deck.s),
    slide:vx*deck.c+vy*deck.s, descent:vy*deck.c-vx*deck.s-deck.omega*footAlong,
    tilt:angle*180/Math.PI};
}
function marineContact(pts,t) {
  const pad=pads[0], d=deckPose(pad,t);
  for (const pt of pts) {
    const dx=pt.x-d.x, dy=pt.y-d.y;
    const along=dx*d.c+dy*d.s, depth=dy*d.c-dx*d.s;
    if (Math.abs(along)<=pad.w/2 && depth>=0 && depth<=14)
      return {pt,pad,deck:d};

  const pt=pts.find(point => point.y>=waterY(point.x,t));
  if (pt) return {pt,water:true,deck:d};
}
function lugState(b) {
  const c=Math.cos(b.a), s=Math.sin(b.a), pad=pads[0];
  return {x:b.x+14*s,y:b.y-14*c,dx:b.x+14*s-pad.cx,
    gap:pad.y-b.y+14*c,vx:b.vx+14*c*b.spin,vy:b.vy+14*s*b.spin,
    tilt:Math.atan2(s,c)*180/Math.PI};
}
const BOOSTER_COLLIDERS=[

  [[6,-14.45],[9,-14.45],[9,-13.55],[6,-13.55]],

const TOWER_SOLIDS=[
  [-65,-49,-57,108,'撞上塔架'],[45,49,5,106,'撞上塔架'],
  [-49,-18,0,5,'撞上机械臂'],[18,49,0,5,'撞上机械臂'],

// Swept SAT over the hull and the rectangle axes. A small angular segment uses
// its midpoint orientation with a conservative bound on rotational travel.
function sweptHullIntersects(hull,from,b,x0,x1,y0,y1) {
  const dx=b.x-from.x,dy=b.y-from.y;
  const turn=angDiff(b.a,from.a),pieces=Math.max(1,Math.ceil(Math.abs(turn)/0.012));
  const margin=23*Math.abs(turn)/(2*pieces);
  for(let step=0;step<pieces;step++){
    const angle=from.a+turn*(step+0.5)/pieces,c=Math.cos(angle),s=Math.sin(angle);
    const x=from.x+dx*step/pieces,y=from.y+dy*step/pieces;
    let enter=0,exit=1;
    for(let axis=-2;axis<hull.length && enter<=exit;axis++){
      let nx=axis===-2?1:0,ny=axis===-1?1:0;
      if(axis>=0){
        const [ax,ay]=hull[axis], [bx,by]=hull[(axis+1)%hull.length];
        const ex=bx-ax,ey=by-ay,len=Math.hypot(ex,ey);
        nx=(-ey*c-ex*s)/len;ny=(-ey*s+ex*c)/len;
      }
      let lo=Infinity,hi=-Infinity;
      for(const [px,py] of hull){
        const projection=(x+px*c-py*s)*nx+(y+px*s+py*c)*ny;
        lo=Math.min(lo,projection);hi=Math.max(hi,projection);
      }
      const min=(nx>=0?x0:x1)*nx+(ny>=0?y0:y1)*ny-margin;
      const max=(nx>=0?x1:x0)*nx+(ny>=0?y1:y0)*ny+margin;
      const velocity=(dx*nx+dy*ny)/pieces;
      if(Math.abs(velocity)<1e-10){
        if(hi<min || lo>max) enter=Infinity;
      }else{
        const first=(min-hi)/velocity,last=(max-lo)/velocity;
        enter=Math.max(enter,Math.min(first,last));exit=Math.min(exit,Math.max(first,last));
      }
    }
    if(enter<=exit) return true;
  }

function towerContact(b,from=b) {

    if(Math.min(from.x,b.x)-23>x1 || Math.max(from.x,b.x)+23<x0 ||
       Math.min(from.y,b.y)-23>y1 || Math.max(from.y,b.y)+23<y0) continue;
    if(BOOSTER_COLLIDERS.some(hull=>sweptHullIntersects(hull,from,b,x0,x1,y0,y1))) return {pt:{x:b.x,y:b.y},reason};
  }

  if(lug.gap>0 || lug.vy<0 || Math.abs(lug.dx)>7+1e-8) return;
  const reason=Math.abs(lug.tilt)>8+1e-8?'捕获倾角过大':
    Math.abs(lug.vx)>7+1e-8 || lug.vy>14+1e-8?'捕获相对速度过快':'';

function findContact(pts, t, body=ship, previous=body) {

    const hit=marineContact(pts,t);
    if(hit?.pad && previous!==body){
      const pt=previousPoint(hit.pt,body,previous),deck=deckPose(hit.pad,t-FIXED);
      hit.pt.fromAbove=(pt.y-deck.y)*deck.c-(pt.x-deck.x)*deck.s<=1e-8;
    }
    return hit;

  if (levelDef.type === 'planetoid') {
    for (const p of pts) {
      const d = dist2(p.x, p.y, P.cx, P.cy);
      if (d <= P.R) {
        const nx = (p.x - P.cx)/d, ny = (p.y - P.cy)/d;
        const ang = Math.atan2(p.y - P.cy, p.x - P.cx);
        const onPad = Math.abs(angDiff(ang, -Math.PI/2)) < levelDef.pads[0].arc;
        return {pt:p, normal:{x:nx,y:ny}, pad:onPad ? {m:levelDef.pads[0].m} : null};

    for (const p of pts) for (const pd of pads) {

      if (p.x >= cx - pd.w/2 - 2 && p.x <= cx + pd.w/2 + 2 &&
          p.y >= pd.y && p.y <= pd.y + 16) {

        return {pt:p, normal:{x:0,y:-1}, pad:pd};

    }

            p.y >= py && p.y <= py + 16) {

          return {pt:p, normal:{x:0,y:-1}, pad:pd};
        }
    }
    for (const p of pts) {
      const gy = heightAt(p.x);

  ship.y = deck.y + landOff*deck.s - offset*deck.c;

  if (reason) { crash(reason,approach); return; }

  ship.vx=0; ship.vy=0; ship.spin=0; ship.flame=0; ship.thrusting=false;
  setThrustSound(false); lastThrustSnd=false;

    Math.abs(approach.tilt)>OCEAN.maxTilt ? '相对甲板倾角过大' :
    !contact.pt.foot ? '船身撞上甲板' : !feetFit ? '支脚越过甲板边缘' :
    approach.descent < 0 ? '侧面擦碰甲板' : approach.descent>OCEAN.maxDescent ? '相对下降速度过快' :
    Math.abs(approach.slide)>OCEAN.maxSlide ? '相对横移过快' : '';

function landingFailure(body,pt,normal,pad,t) {

  if(!pt.foot) return '船身撞上平台';
  if(pt.fromAbove===false) return '撞上平台底部';
  const step=1/120;
  const pvx=pad.moving?(padCX(pad,t+step/2)-padCX(pad,t-step/2))/step:0;
  const pvy=pad.moving?(padY(pad,t+step/2)-padY(pad,t-step/2))/step:0;
  const vx=body.vx-pvx-(pt.y-body.y)*body.spin;
  const vy=body.vy-pvy+(pt.x-body.x)*body.spin;

  const why=landingFailure(ship,pt,normal,pad,time);
  const spd = Math.hypot(ship.vx, ship.vy);
  if (!why) {
    const landingOffset = currentModel().landingOffset;
    if (levelDef.type === 'planetoid') {
      const d = dist2(ship.x, ship.y, P.cx, P.cy);
      ship.x += normal.x * (P.R + landingOffset - d); ship.y += normal.y * (P.R + landingOffset - d);
      ship.a = Math.atan2(normal.x, -normal.y);
    } else if (pad.moving) {
      landPad = pad; landOff = ship.x - padCX(pad, time);   // 浮台/冰筏：跟随
      ship.a = 0;
    } else { ship.y = pad.y - landingOffset; ship.a = 0; }
    ship.vx = 0; ship.vy = 0; ship.spin = 0; ship.thrusting = false;
    const fuelBonus = Math.round(ship.fuel * (levelDef.fuel / ship.fuelCapacity)) * 5;
    const gained = 400*pad.m + fuelBonus + Math.max(0, Math.round((50 - spd)*8));
    // 星级：1 基础 + 燃料充足 + 柔和触地
    const starN = clamp(1 + (ship.fuel >= ship.fuelCapacity*0.35 ? 1 : 0) + (spd <= 20 ? 1 : 0), 1, 3);
    settleMission({landed:true, gained, stars:starN, fuel:Math.round(ship.fuel)});
    const starTxt = '★'.repeat(starN) + '☆'.repeat(3 - starN);
    announce(isFreeFlight() ? '着陆成功 SOFT LANDING' : '着陆成功 SOFT LANDING  +' + gained,
             isFreeFlight() ? '剩余燃料 ' + missionResult.fuel :
               starTxt + ' · 燃料加成 +' + fuelBonus + (pad.m===1?'':' · 得分×'+pad.m) + ' · 剩余燃料 ' + missionResult.fuel,
             '#7dffb0', 2.0);

const FLIGHT_ADVICE = {

  '着陆姿态过斜':'触地前将机身转回接近直立',
  '下降速度过快':'更早点火减速，避免临地急刹',
  '横向速度过大':'朝漂移的反方向倾斜点火',
  '落入海面':'先对准甲板中心，再降低下降速度',
  '支脚越过甲板边缘':'让支脚收进甲板两端之间',
  '错过捕获窗口':'先对准双臂中央，再让上部挂点下降',
  '捕获相对速度过快':'在挂点进入双臂前降低横移和下降速度',
  '捕获倾角过大':'调整机身姿态后再进入双臂',
  '撞上塔架':'从双臂正上方进近，避开塔身',
  '撞上机械臂':'先把上部挂点对准双臂中央',
};
function crash(why, approach) {
  ship.visible = false; ship.thrusting = false; ship.flame = 0;
  setThrustSound(false); lastThrustSnd = false;
  settleMission({landed:false, reason:why, approach, fuel:Math.round(ship.fuel)});
  explode(ship.x, ship.y, ship.vx, ship.vy);
  shake = 18; flashA = 0.5; vib(60);
  sfxExplosion();
  announce('坠毁 CRASH · ' + why,
           FLIGHT_ADVICE[why] || (unlimitedAttempts() ? '可以再次尝试' : lives > 0 ? '剩余飞船 ×' + lives : '飞船已耗尽'),
           '#ff6b5e', 1.7);
}
function settleMission(result) {
  lockSettlementInput();
  missionResult = result;
  state = result.landed ? 'landed' : 'crashed';
  stateT = result.landed ? 1.8 : 1.7;
  if (unlimitedAttempts()) return;
  if (result.landed) {
    score += result.gained;
    if (score > best) { best = score; saveBest(); }
    progress.stars[levelIdx] = Math.max(progress.stars[levelIdx], result.stars);
    progress.unlocked = Math.max(progress.unlocked, Math.min(levelIdx + 1, NLV - 1));
    saveProgress();
    stats.landings++;
    if (result.stars === 3) stats.perfects++;
  } else {
    lives--; stats.crashes++;
  }
  saveStats();
}
function showMissionEnd() {
  if (!unlimitedAttempts()) { gotoMap(); return; }
  state = 'freeResult';
  manualPaused = false;
  cancelViewportInput();
  banner = null;
  const result = missionResult;
  document.querySelector('#freeResultScreen [data-action="free"]').hidden = isRecovery();
  document.querySelector('#freeResultScreen [data-action="recovery"]').hidden = !isRecovery();
  if (isRecovery()) {
    const a = result.approach;
    document.getElementById('freeResultTitle').textContent = (isTower()?'塔架捕获':'海上回收')+(result.landed?'成功':'失败');
    document.getElementById('freeResultInfo').textContent = (result.reason || (isTower()?'双臂承载':'已在甲板固定')) +
      (a ? ' · 相对横移 ' + a.slide.toFixed(1) + ' · 相对下降 ' + a.descent.toFixed(1) +
      ' · 相对倾角 ' + a.tilt.toFixed(1) + '°' : '') + ' · 剩余燃料 ' + result.fuel;
    const advice=FLIGHT_ADVICE[result.reason];
    if(advice) document.getElementById('freeResultInfo').textContent+='。'+advice;
    return;
  }
  document.getElementById('freeResultTitle').textContent = result.landed ? '自由飞行 · 着陆成功' : '自由飞行 · 飞行结束';
  document.getElementById('freeResultInfo').textContent = stationTitle(levelDef) + ' · ' + currentModel().label +
    (result.landed ? ' · 剩余燃料 ' + result.fuel : ' · ' + result.reason + (FLIGHT_ADVICE[result.reason]?'。'+FLIGHT_ADVICE[result.reason]:''));
}

/* ---------- 特效 ---------- */
function spawnFlame() {
  const n = noseDir();
  const bx = ship.x - n.x*9, by = ship.y - n.y*9;
  for (let i = 0; i < 2; i++) {
    if (particles.length > 700) particles.shift();
    const sp = rand(55, 110), j = rand(-0.5, 0.5);
    particles.push({
      x: bx, y: by,
      vx: -n.x*sp + ship.vx*0.6 + Math.cos(j)*14,
      vy: -n.y*sp + ship.vy*0.6 + Math.sin(j)*14,
      life: rand(0.25, 0.55), max: 0.55, kind: 'jet',
      tint: Math.random() < 0.35 ? '#fff2cf' : '#ffb347' });
  }
}
function spawnRCS(side) {           // side: -1 左喷 / 1 右喷（与转向方向相反）
  const [px, py] = shipPt(side * 5, -8);
  const c = Math.cos(ship.a), s = Math.sin(ship.a);
  const lvx = side * 20, lvy = 0;
  particles.push({ x:px, y:py,
    vx: ship.vx*0.5 + lvx*c - lvy*s, vy: ship.vy*0.5 + lvx*s + lvy*c,
    life: 0.22, max: 0.22, kind: 'dust', tint: '#dfeeff' });
}
function spawnDust(x, y, n) {
  for (let i = 0; i < n; i++) {
    const dir = i % 2 === 0 ? 1 : -1;              // 向两侧卷起
    particles.push({ x, y,
      vx: dir * rand(30, 95), vy: rand(-60, -10),
      life: rand(0.35, 0.8), max: 0.8, kind: 'dust', tint: '#c9d8ff' });
  }
}
const PARTICLE_CAP = 900;           // 爆炸等瞬时粒子峰值上限
function explode(x, y, vx, vy) {
  for (let i = 0; i < 46; i++) {
    const a = rand(0, TAU), sp = rand(40, 230);
    particles.push({ x, y, vx: Math.cos(a)*sp + vx*0.4, vy: Math.sin(a)*sp + vy*0.4,
                     life: rand(0.5, 1.3), max: 1.3, kind: 'boom' });
  }
  particles.push({ x, y, r: 6, life: 0.45, max: 0.45, kind: 'ring' });
  const hull = currentModel().hull;
  for (let i = 0; i < hull.length - 1; i++) {
    const [ax, ay] = hull[i], [bx, by] = hull[i+1];
    frags.push({ ax, ay, bx, by, x, y,
                 vx: vx*0.3 + rand(-70, 70), vy: vy*0.3 + rand(-70, 70),
                 rot: 0, vr: rand(-4, 4), life: rand(0.9, 1.6), max: 1.6 });
  }
  if (particles.length > PARTICLE_CAP)
    particles.splice(0, particles.length - PARTICLE_CAP);
}
function spawnPlumes(dt) {
  for (const g of geysers) {
    if (geyserState(g, time) !== 'active') continue;
    if (particles.length > 650) continue;
    if (Math.random() < dt * 46) {
      particles.push({ x: g.x + rand(-14, 14), y: g.y,
        vx: rand(-12, 12), vy: -rand(90, 175),
        life: rand(0.8, 1.4), max: 1.4, kind: 'plume' });
    }
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.kind === 'ring') { p.r += 260 * dt; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - 1.2*dt); p.vy *= (1 - 1.2*dt);
  }
  for (let i = frags.length - 1; i >= 0; i--) {
    const f = frags[i];
    f.life -= dt;
    if (f.life <= 0) { frags.splice(i, 1); continue; }
    f.x += f.vx*dt; f.y += f.vy*dt; f.rot += f.vr*dt;
    if (terrain) { const gy = heightAt(f.x); if (f.y > gy - 4) { f.vy = -Math.abs(f.vy)*0.4; f.vx *= 0.7; } }
  }
}

/* ---------- 船体物理 ---------- */
function advanceBody(body,dt,t) {
  envForces(body,dt,t);
  body.x+=body.vx*dt;body.y+=body.vy*dt;
  if(P) return dist2(body.x,body.y,P.cx,P.cy)>5400?'lost':null;
  if(body.x<24){body.x=24;body.vx=Math.abs(body.vx)*0.5;}
  if(body.x>WORLD_W-24){body.x=WORLD_W-24;body.vx=-Math.abs(body.vx)*0.5;}
  if(body.y< -700){body.y=-700;body.vy=Math.max(body.vy,0);}
  return levelDef.type==='float'&&body.y>1750?'cloud':null;
}
function idleOutcome(initial,start,introSeconds) {
  const body={...initial},points=[],previous={};
  // Ignore independent hazards here: they can only turn an otherwise legal
  // no-input landing into a crash. Never rely on them to reject a seed.
  let t=start;
  for(let remaining=introSeconds;remaining>0;remaining-=FIXED) t+=FIXED;
  for(let i=0;i<120*60;i++){
    previous.x=body.x;previous.y=body.y;previous.a=body.a;
    t+=FIXED;
    turnShip(body,currentModel(body),false,false,FIXED);
    if(advanceBody(body,FIXED,t)) return 'failure';
    const pts=shipWorldPts(body,points);
    const contact=findContact(pts,t,body,previous);
    if(!contact) continue;
    const reason=isTower()?contact.reason:isRecovery()?
      recoveryFailure(contact,deckApproach(body,contact.deck),feetFitDeck(pts,contact.deck)):
      landingFailure(body,contact.pt,contact.normal,contact.pad,t);
    return reason?'failure':'success';
  }
  return 'unresolved';
}
function physics(dt) {
  const previous={x:ship.x,y:ship.y,a:ship.a};
  const model = currentModel();
  turnShip(ship, model, keys.left, keys.right, dt);
  if (keys.left !== keys.right && Math.random() < dt * 10)
    spawnRCS(keys.right ? -1 : 1);               // 转向时对侧姿态喷口
  const thr = keys.up && ship.fuel > 0;
  ship.thrusting = thr;
  ship.flame += ((thr ? 1 : 0) - ship.flame) * Math.min(1, dt * 9);
  if (thr) {
    fireEngine(ship, model, dt);
    spawnFlame();
  }
  if (thr !== lastThrustSnd) { setThrustSound(thr); lastThrustSnd = thr; }
  if (AC && Math.abs(ship.flame - lastFlame) > 0.04) {
    lastFlame = ship.flame;
    engineLP.frequency.setTargetAtTime(260 + 560 * ship.flame, AC.currentTime, 0.08);
  }
  const boundary=advanceBody(ship,dt,time);
  if(boundary==='lost'){
    spawnShip();
    announce('信号丢失 · 位置已重置', '', '#ffd75e', 1.5);
    return;
  }
  if(boundary==='cloud'){crash('坠入云层');return;}

  const pts = shipWorldPts();
  for (const a of asteroids)
    for (const p of pts)
      if (dist2(p.x, p.y, a.x, a.y) < a.r * 0.72) { crash('陨石撞击'); return; }

  for (const s of spires) for (const p of pts)
    if (hitsSpire(s, p)) { crash('撞上岩柱'); return; }

  warnT += dt;
  if (warnT > 1.15) { warnT = 0;
    if (ship.fuel > 0 && lowFuel()) sfxBeep(196, 0.12, 'square', 0.08); }

  if (S.trail) {
    trailT += dt;
    if (trailT > 0.025) { trailT = 0; trail.push({ x: ship.x, y: ship.y });
      if (trail.length > 34) trail.shift(); }
  }

  checkContact(previous);
}

/* ---------- 相机 ---------- */
function clampCamX(x, z) {
  const half = (W*0.5) / z;
  if (half >= WORLD_W/2) return WORLD_W/2;
  return clamp(x, half, WORLD_W - half);
}
function nearestTarget() {
  if (P) {
    const half=P.R*Math.sin(levelDef.pads[0].arc);
    return {x:P.cx,y:P.cy-P.R,w:2*half,below:P.R*(1-Math.cos(levelDef.pads[0].arc))};
  }
  let target=null, distance=Infinity;
  for (const pad of pads) {
    const x=padCX(pad,time),y=padY(pad,time);
    const d=Math.hypot(ship.x-x,ship.y-y);
    if (d>=distance || !Number.isFinite(d)) continue;
    distance=d;
    target={x,y,w:isTower()?130:pad.w,above:isTower()?58:0,below:isTower()?114:isRecovery()?48:0};
  }
  return target;
}
function smoothRange(value, start, end) {
  const t=clamp((value-start)/(end-start),0,1);
  return t*t*(3-2*t);
}
function camFollow(dt, snap = false) {
  const target=nearestTarget();
  const width=Math.max(1,W-safeLeft-safeRight),height=Math.max(1,H-safeTop-safeBottom);
  const dx=target ? target.x-ship.x : 0,dy=target ? target.y-ship.y : 0;
  const distance=Math.hypot(dx,dy);
  const heavy=ship.modelId==='superheavy',bodyHeight=heavy?42:23;
  const cruise=(heavy?36:28)/bodyHeight,minimum=(heavy?30:24)/bodyHeight;
  const close=(heavy?57:48)/bodyHeight;
  const halfWidth=target?Math.min(target.w/2,74):0;
  const top=Math.min(-bodyHeight/2,dy-(target?.above||0));
  const bottom=Math.max(bodyHeight/2,dy);
  const left=Math.min(-12,dx-halfWidth),right=Math.max(12,dx+halfWidth);
  // The camera projects its anchor at 42% of screen height. Keep both subjects
  // in the useful portion of the view before asking for a close-up.
  const fit=Math.min(width*0.88/(right-left),height*0.81/(bottom-top));
  const preview=target ? smoothRange(fit/cruise,0.55,1.12) : 0;
  const final=target ? 1-smoothRange(distance,25,132) : 0;
  const desired=cruise+(close-cruise)*final;
  const framing=clamp(fit,minimum,desired);
  const zoom=Math.max(W/WORLD_W,cruise+(framing-cruise)*preview);
  const weight=preview*(1-final*0.55);
  const cx=ship.x+(left+right)/2*weight+(safeRight-safeLeft)/(2*zoom);
  const aimY=ship.y+((top+bottom)/2+height*0.06/zoom)*weight+(safeBottom-safeTop)/(2*zoom);
  const shipHeadroom=safeTop+35+bodyHeight*zoom*0.54;
  const cy=Math.min(aimY,ship.y+(H*0.42-shipHeadroom)/zoom);
  const blend=snap?1:1-Math.exp(-dt*4.1);
  cam.zoom+=(zoom-cam.zoom)*blend;
  cam.x+=(cx-cam.x)*blend;cam.y+=(cy-cam.y)*blend;
  cam.x=clampCamX(cam.x,cam.zoom);
}

/* ---------- 主更新 ---------- */
function update(dt) {
  time += dt;
  shake = Math.max(0, shake - 44*dt);
  flashA = Math.max(0, flashA - 1.7*dt);
  updateParticles(dt);
  updateAsteroids(dt);
  if (state !== 'map' && !isModeMenu() && state !== 'freeResult') {
    if (geysers.length) spawnPlumes(dt);
    updateMeteors(dt);
    if (levelDef.duststorm) spawnStormDust(dt);
  }
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }

  switch (state) {
    case 'title':
      cam.zoom = Math.max(0.4, W / WORLD_W);
      cam.x = clampCamX(mod(time * 26, WORLD_W), cam.zoom);
      cam.y = 950;
      break;
    case 'map':
      cam.x = time * 12; cam.y = 900; cam.zoom = 0.4;
      break;
    case 'levelIntro':
      camFollow(dt);
      stateT -= dt;
      if (stateT <= 0) state = 'playing';
      break;
    case 'playing':
      physics(dt);
      camFollow(dt);
      break;
    case 'landed':
      if (isTower()) ship.y=missionResult.startY+3*clamp((1.8-stateT-0.2)/0.42,0,1);
      else if (landPad?.marine) rideDeck(deckPose(landPad,time));
      else if (landPad && landPad.moving) {           // 骑着浮台/冰筏移动
        ship.x = padCX(landPad, time) + landOff;
        ship.y = padY(landPad, time) - currentModel().landingOffset;
      }
      camFollow(dt);
      stateT -= dt;
      if (stateT <= 0) showMissionEnd();
      break;
    case 'crashed':
      stateT -= dt;
      if (stateT <= 0) {
        if (unlimitedAttempts()) showMissionEnd();
        else if (lives > 0) { spawnShip(0.8); state = 'levelIntro'; stateT = 0.8; }
        else { lockSettlementInput(); state = 'gameover'; runFresh = true; }
      }
      break;
    case 'gameover':
      break;
  }
}

/* ---------- 渲染 ---------- */
function glowStroke(color, width, glowA) {
  ctx.strokeStyle = color;
  ctx.globalAlpha = glowA ?? 0.30;
  ctx.lineWidth = width * 3.4;
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.lineWidth = width;
  ctx.stroke();
}
function drawStars() {
  for (const st of stars) {
    const sx = mod(st.x - cam.x*st.f, W + 2400) - 1200;
    const sy = mod(st.y - cam.y*st.f*0.6, H + 2400) - 1200;
    if (sx < -4 || sx > W+4 || sy < -4 || sy > H+4) continue;
    ctx.globalAlpha = st.a * (0.55 + 0.45*Math.sin(time*1.7 + st.x));
    ctx.fillStyle = '#cfe6ff';
    ctx.fillRect(sx, sy, st.s, st.s);
  }
  ctx.globalAlpha = 1;
}
function parallax(depth) {
  return {x:(cam.x-WORLD_W/2)*depth+ship.vx*depth*0.35,
    y:(cam.y-800)*depth+ship.vy*depth*0.35};
}
function drawHorizon(color, depth, height, scale) {
  const drift=parallax(depth);
  ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W+16;x+=16){
    const p=(x+drift.x)*scale;
    ctx.lineTo(x,height-drift.y+Math.sin(p)*16+Math.sin(p*2.61)*8);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=color;ctx.fill();
}
let skyGradient=null, skyTheme=null, skyHeight=0;
function drawSky() {
  const th = levelDef.theme;
  if(skyTheme!==th || skyHeight!==H){
    skyTheme=th;skyHeight=H;
    skyGradient=ctx.createLinearGradient(0,0,0,H);
    skyGradient.addColorStop(0,th.sky[0]);skyGradient.addColorStop(1,th.sky[1]);
  }
  ctx.fillStyle=skyGradient;ctx.fillRect(0,0,W,H);
  if (th.skyBodies) for (const b of th.skyBodies) if (b.kind === 'galaxy') drawGalaxy(b);
  if (terrain || isTower()) {
    const tint=levelDef.theme.ridge || '#6b8999';
    drawHorizon(tint+'22',0.065,H*0.61,0.012);
    drawHorizon(tint+'46',0.155,H*0.73,0.019);
    drawHorizon(tint+'24',0.27,H*0.94,0.028);
  }
  const ds = levelDef.duststorm;                 // 沙尘暴天空染色
  if (ds) {
    const c = mod(time + ds.phase0, ds.period);
    if (c >= ds.calm + ds.warn) { ctx.fillStyle = 'rgba(200,80,30,0.12)'; ctx.fillRect(0, 0, W, H); }
    else if (c >= ds.calm) { ctx.fillStyle = `rgba(200,80,30,${0.05 + 0.05*Math.sin(time*6)})`; ctx.fillRect(0, 0, W, H); }
  }
}
function drawGalaxy(b) {                          // 银河斜带（暗面）
  ctx.save(); ctx.translate(W/2, H/2); ctx.rotate(-0.5);
  ctx.fillStyle = 'rgba(180,200,255,0.05)';
  ctx.fillRect(-W, -40, 2*W, 80);
  ctx.fillStyle = 'rgba(180,200,255,0.035)';
  ctx.fillRect(-W, 60, 2*W, 40);
  ctx.restore();
}
function skyDisc(x, y, r, col, rim) {             // 天体底盘 + 大气辉光
  const rg = ctx.createRadialGradient(x, y, r*0.8, x, y, r*1.25);
  rg.addColorStop(0, rim + '55'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(x, y, r*1.25, 0, TAU); ctx.fill();
  const disc=ctx.createRadialGradient(x-r*0.42,y-r*0.48,r*0.08,x,y,r);
  disc.addColorStop(0,col);disc.addColorStop(0.65,col);disc.addColorStop(1,'#202b35');
  ctx.fillStyle = disc;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function skyShade(x, y, r) {                      // 晨昏线：右侧阴影 + 轮廓
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  const shade=ctx.createLinearGradient(x-r,y-r*.2,x+r,y+r*.35);
  shade.addColorStop(0,'rgba(236,226,206,.12)');
  shade.addColorStop(.45,'rgba(1,6,13,.06)');
  shade.addColorStop(.76,'rgba(1,6,13,.53)');
  shade.addColorStop(1,'rgba(1,6,13,.88)');
  ctx.fillStyle=shade;ctx.fillRect(x-r,y-r,r*2,r*2);
  ctx.restore();
}
const PLANET_SURFACES={
  earth:['#24486b','#789782','#9aafbc','#83a9c3'],
  mars:['#a06e51','#6f4135','#d3ab88','#b78970'],
  jupiter:['#af967a','#725743','#e1c4a4','#c1a98c'],
  charon:['#777883','#4b4a50','#b1a6a2','#9ea5b0'],
};
function drawPlanetSurface(kind,x,y,r) {
  const [base,dark,light,rim]=PLANET_SURFACES[kind];
  skyDisc(x,y,r,base,rim);
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.clip();
  if(kind==='jupiter'){
    for(let band=0;band<18;band++){
      const by=y-r+band*r/9;
      ctx.strokeStyle=band%4===0?dark:light;ctx.globalAlpha=.12+.09*Math.sin(band*3);
      ctx.lineWidth=r*(.05+.039*(band%3));
      ctx.beginPath();ctx.moveTo(x-r,by);ctx.bezierCurveTo(x-r*.3,by+r*.08,x+r*.2,by-r*.09,x+r,by);ctx.stroke();
    }
    ctx.globalAlpha=.45;ctx.fillStyle='#9c6150';ctx.beginPath();
    ctx.ellipse(x+r*.24,y+r*.29,r*.21,r*.075,-.07,0,TAU);ctx.fill();
  }else{
    for(let i=0;i<26;i++){
      const seed=Math.sin(i*17.31+1)*43758.5453;
      const px=x+(seed-Math.floor(seed)-.5)*r*2;
      const py=y+Math.cos(i*2.4)*r*.94;
      const width=r*(.055+.045*(i%5));
      ctx.globalAlpha=.24;ctx.fillStyle=i%3===0?light:dark;ctx.beginPath();
      for(let n=0;n<8;n++){
        const angle=n*TAU/8;

function drawParticles(v) {
  const stride=renderQuality().particleStride;
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    if(p.x<v.l-120 || p.x>v.r+120 || p.y<v.t-120 || p.y>v.b+120) continue;
    if(p.kind!=='ring' && p.kind!=='boom' && i%stride!==0) continue;
    const t = clamp(p.life / p.max, 0, 1);
    if (p.kind === 'ring') {
      ctx.globalAlpha = t * 0.8;
      ctx.strokeStyle = '#ffd7a0'; ctx.lineWidth = 2.5/cam.zoom;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
      continue;
    }
    const atmosphere=Boolean(levelDef.drag || isTower());
    if(atmosphere && p.kind==='jet' && t<0.7){
      ctx.globalAlpha=t*0.19;ctx.fillStyle='#a4afb5';
      ctx.beginPath();ctx.arc(p.x,p.y,1+(1-t)*4,0,TAU);ctx.fill();continue;
    }
    ctx.globalAlpha = t;
    ctx.strokeStyle = p.kind === 'plume' ? (t > 0.5 ? '#ffb347' : '#ff6b3d') :
                      p.kind === 'boom' ? (t > 0.5 ? '#ffe9b0' : '#ff6b3d') :
                      p.kind === 'sand' ? '#d8a05a' :
                      p.kind === 'dust' ? (p.tint || '#c9d8ff') : (p.tint || '#ffb347');
    ctx.lineWidth = 1.8/cam.zoom;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx*0.03, p.y - p.vy*0.03);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawPrediction() {

    computePrediction();
    predictionDue = time + 1/renderQuality().prediction;
  }
  if (!pred.pts.length && !pred.impact) return;
  const noisy = levelDef.predNoise && mod(time, 5) < 0.8;   // 冥王星：预测线干扰
  ctx.fillStyle = '#59ffc8';
  ctx.globalAlpha=0.35;
  ctx.beginPath();
  pred.pts.forEach((p, i) => {
    let ox = 0, oy = 0;
    if (noisy) { ox = Math.sin(i*13.7 + time*30)*9/cam.zoom;
                 oy = Math.cos(i*7.3 + time*25)*9/cam.zoom; }

    ctx.moveTo(p.x+ox+radius,p.y+oy);ctx.arc(p.x+ox,p.y+oy,radius,0,TAU);
  });
  ctx.fill();
  if (pred.impact) {

    ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 2/cam.zoom;
    const s = 7/cam.zoom, q = pred.impact;
    ctx.beginPath();
    ctx.moveTo(q.x-s, q.y-s); ctx.lineTo(q.x+s, q.y+s);
    ctx.moveTo(q.x+s, q.y-s); ctx.lineTo(q.x-s, q.y+s);

  }

function drawShip() {

    flow.addColorStop(0.48,'rgba(250,174,100,.72)');flow.addColorStop(1,'rgba(216,117,78,0)');

    metal.addColorStop(1,'#77909d');

  ctx.strokeStyle='#c3ccd0';ctx.lineWidth=0.7/cam.zoom;ctx.stroke();

function drawSplash() {

  ctx.strokeStyle='#a7dae2';ctx.lineWidth=1/cam.zoom;

    ctx.ellipse(ship.x,y,5+t*65,1+t*9,0,0,TAU);ctx.stroke();

  };

    const span=P?P.R*Math.sin(p.arc)*cam.zoom:p.w*cam.zoom/2;
    if(!Number.isFinite(x+y+span))continue;

    {x:Math.max(hudX,safeLeft+64),y:safeTop+10,w:W<380?54:72,h:27},

  } else if (i === 7) {                               // 木卫二：冰裂纹

  } else if (i === 8) {                               // 木星：云带
    ctx.strokeStyle = '#a87850';
    for (const dy of [-6, 0, 6]) {
      ctx.beginPath(); ctx.moveTo(x-14, y+dy); ctx.lineTo(x+14, y+dy); ctx.stroke();
    }

    ctx.fillStyle = '#e8ecf4';
    ctx.beginPath(); ctx.ellipse(x+2, y+2, 6, 5, 0.4, 0, TAU); ctx.fill();

  ctx.globalAlpha = 1;
  if (!unlocked) {                                    // 锁
    ctx.strokeStyle = '#6a7a96'; ctx.lineWidth = 1.4;
    ctx.strokeRect(x-5, y-2, 10, 8);

function mapHitTest(x, y) {
  if (isCompactMap()) {
    if (x < 10 + safeLeft || x > W - 10 - safeRight) return null;
    const top = mapNodePos(0).y, rowH = mapRowHeight();
    for (let i = 0; i < NLV; i++)
      if (Math.abs(y - (top + i*rowH)) <= rowH/2) return i;
    return null;
  }
  if (isLandscapeMap()) {
    const cellW = (W-safeLeft-safeRight)*0.20;
    for (let i = 0; i < NLV; i++) {
      const p = mapNodePos(i);
      if (Math.abs(x - p.x) < cellW*0.48 && y >= p.y - 22 && y < p.y + (H-safeTop-safeBottom)*0.28 - 22) return i;
    }
    return null;
  }
  const touch = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  for (let i = 0; i < NLV; i++) {
    const p = mapNodePos(i);
    if (touch) {
      if (Math.abs(x - p.x) < 46 && y > p.y - 28 && y < p.y + 74) return i;
    } else if (dist2(x, y, p.x, p.y) < 30) return i;
  }
  return null;
}
