/* ---------- 工具函数 ---------- */
const TAU = Math.PI * 2;
const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const mod   = (a, n) => ((a % n) + n) % n;
const dist2 = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const angDiff = (a, b) => mod(a - b + Math.PI, TAU) - Math.PI;

/* ---------- 画布 ---------- */
const cvs = document.getElementById('cv');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1, vig = null;
let stars = [];

function genStars() {
  stars = [];
  const layers = [
    { f: 0.10, n: W * H / 16000, s: 1.0, a: 0.5 },
    { f: 0.28, n: W * H / 13000, s: 1.4, a: 0.8 },
    { f: 0.55, n: W * H / 26000, s: 2.0, a: 1.0 },
  ];
  for (const L of layers)
    for (let i = 0; i < L.n; i++)
      stars.push({ x: rand(0, W + 2400), y: rand(0, H + 2400),
                   f: L.f, s: L.s * rand(0.6, 1.2), a: L.a * rand(0.4, 1) });
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,10,0.55)');
  vig = g;
  genStars();
}
window.addEventListener('resize', resize);

/* ---------- 音频（程序化合成，无素材） ---------- */
let AC = null, master = null, noiseBuf = null, noiseGain = null, engineLP = null;
let ambSrc = null, ambFilter = null, ambGain = null, pendingAmb = null;
let muted = false;

function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.5;
    master.connect(AC.destination);
    const len = AC.sampleRate; noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // 主引擎
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    engineLP = AC.createBiquadFilter(); engineLP.type = 'lowpass'; engineLP.frequency.value = 260;
    noiseGain = AC.createGain(); noiseGain.gain.value = 0;
    src.connect(engineLP); engineLP.connect(noiseGain); noiseGain.connect(master); src.start();
    // 环境音（按天体）
    ambSrc = AC.createBufferSource(); ambSrc.buffer = noiseBuf; ambSrc.loop = true;
    ambFilter = AC.createBiquadFilter(); ambFilter.type = 'bandpass'; ambFilter.frequency.value = 200;
    ambGain = AC.createGain(); ambGain.gain.value = 0;
    ambSrc.connect(ambFilter); ambFilter.connect(ambGain); ambGain.connect(master); ambSrc.start();
    if (pendingAmb) setAmbience(pendingAmb);
  } catch (e) { AC = null; }
}
function setAmbience(a) {
  pendingAmb = a;
  if (!AC || !ambGain) return;
  const t = AC.currentTime;
  if (a) {
    ambFilter.type = a.f < 130 ? 'lowpass' : 'bandpass';
    ambFilter.frequency.setTargetAtTime(a.f, t, 0.4);
    ambGain.gain.setTargetAtTime(muted ? 0 : a.g, t, 0.6);
  } else ambGain.gain.setTargetAtTime(0, t, 0.4);
}
function setThrustSound(on) {
  if (!AC) return;
  noiseGain.gain.setTargetAtTime(on ? 0.22 : 0, AC.currentTime, 0.06);
}
function sfxBeep(freq, dur, type, vol, slideTo) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  g.gain.setValueAtTime(vol || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function sfxExplosion() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(1000, t); f.frequency.exponentialRampToValueAtTime(110, t + 0.6);
  g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + 0.75);
  sfxBeep(130, 0.5, 'sine', 0.30, 42);
}
function sfxLand() {
  sfxBeep(660, 0.12, 'sine', 0.16);
  setTimeout(() => sfxBeep(880, 0.16, 'sine', 0.16), 130);
}
function vib(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- 地形生成（中点位移） ---------- */
function genTerrain(lv) {
  const h = new Float32Array(TN);
  const base = 1060, amp = 240 * lv.rough;
  h[0] = base + rand(-amp, amp) * 0.6;
  h[TN-1] = base + rand(-amp, amp) * 0.6;
  let step = TN - 1, delta = amp;
  while (step > 1) {
    const half = step >> 1;
    for (let i = half; i < TN - 1; i += step)
      h[i] = (h[i - half] + h[i + half]) / 2 + rand(-delta, delta);
    step = half; delta *= 0.58;
  }
  for (let i = 0; i < TN; i++) h[i] = clamp(h[i], 520, 1400);

  const st = WORLD_W / (TN - 1);
  pads = [];
  const overlaps = (x1, x2) => pads.some(p => x1 < p.x2 + 140 && x2 > p.x1 - 140);
  for (const spec of lv.pads) {
    let cx, tries = 0;
    if (spec.peak) {
      let bi = Math.floor(TN * 0.25), bv = 1e9;
      for (let i = Math.floor(TN*0.2); i < TN*0.8; i++)
        if (h[i] < bv) { bv = h[i]; bi = i; }
      cx = bi * st;
    } else {
      do { cx = rand(600, WORLD_W - 600); tries++; }
      while (overlaps(cx - spec.w/2, cx + spec.w/2) && tries < 20);
    }
    const w = spec.w * S.padW;
    const x1 = cx - w/2, x2 = cx + w/2;
    const i1 = clamp(Math.round(x1/st), 2, TN-3), i2 = clamp(Math.round(x2/st), i1+1, TN-3);
    let y = 0; for (let i = i1; i <= i2; i++) y += h[i];
    y /= (i2 - i1 + 1);
    for (let i = i1; i <= i2; i++) h[i] = y;
    for (let k = 1; k <= 5; k++) {
      const f = k / 6;
      if (i1 - k >= 0)    h[i1-k] = h[i1-k] * (1-f) + y * f;
      if (i2 + k < TN)    h[i2+k] = h[i2+k] * (1-f) + y * f;
    }
    pads.push({ x1: i1*st, x2: i2*st, y, m: spec.m });
  }
  terrain = { h, step: st };
}
function heightAt(x) {
  const f = clamp(x, 0, WORLD_W - 0.01) / terrain.step;
  const i = Math.floor(f), fr = f - i;
  return terrain.h[i] * (1 - fr) + terrain.h[Math.min(i+1, TN-1)] * fr;
}

/* ---------- 间歇泉（木卫一） ---------- */
function genGeysers(n) {
  geysers = [];
  const centers = pads.map(p => (p.x1 + p.x2) / 2);
  let placed = 0, guard = 0;
  while (placed < n && guard++ < 200) {
    const gx = rand(500, WORLD_W - 500);
    if (centers.some(c => Math.abs(gx - c) < 450)) continue;
    if (geysers.some(g => Math.abs(g.x - gx) < 700)) continue;
    geysers.push({ x:gx, y:heightAt(gx)-4, w:70, h:430, f:250,
                   period:6.5, phase:rand(0, 6.5), activeDur:1.7, warnDur:1.2 });
    placed++;
  }
}
function geyserState(g, t) {
  const c = mod(t + g.phase, g.period);
  return c < g.activeDur ? 'active' : (c > g.period - g.warnDur ? 'warn' : 'idle');
}

/* ---------- 陨石（慢速漂移，绝不生成在平台附近） ---------- */
function genAsteroids(n) {
  asteroids = [];
  for (let i = 0; i < n; i++) {
    const r = rand(14, 26), verts = [];
    for (let k = 0; k < 10; k++) verts.push(r * rand(0.72, 1.18));
    let x, tries = 0;
    do { x = rand(0, WORLD_W); tries++; }
    while (tries < 40 && pads.some(p => p.x1 !== undefined &&
             Math.abs(x - (p.x1+p.x2)/2) < 550));
    asteroids.push({ x, y: rand(320, 820), r, verts,
                     rot: rand(0, TAU), vr: rand(-0.4, 0.4),
                     vx: (rand(0,1)<0.5?-1:1) * rand(2, 6), vy: rand(-2, 2) });
  }
}
function updateAsteroids(dt) {
  for (const a of asteroids) {
    a.x += a.vx * dt;
    if (a.x < -120) a.x += WORLD_W + 240;
    else if (a.x > WORLD_W + 120) a.x -= WORLD_W + 240;
    a.y += a.vy * dt;
    if (a.y < 260 || a.y > 980) { a.vy *= -1; a.y = clamp(a.y, 260, 980); }
    a.rot += a.vr * dt;
  }
}

/* ---------- 平台位置（浮空平台随时间漂移） ---------- */
function padCX(p, t) {
  if (p.moving) return p.cx + p.amp * Math.sin(t * p.spd + p.phase);
  if (p.x1 !== undefined) return (p.x1 + p.x2) / 2;
  return NaN;                                  // 行星弧形平台无水平中心
}

/* ---------- 关卡装载 ---------- */
function loadLevel(i) {
  levelIdx = i; levelDef = LEVELS[i];
  particles = []; frags = []; banner = null; landPad = null;
  trail = []; trailT = 0;
  P = null; terrain = null; pads = []; geysers = [];
  if (levelDef.type === 'terrain') {
    genTerrain(levelDef);
    if (levelDef.geysers) genGeysers(levelDef.geysers);
  } else if (levelDef.type === 'planetoid') {
    P = { cx: WORLD_W/2, cy: 980, R: levelDef.R, craters: [] };
    for (let k = 0; k < 6; k++) {
      const ang = rand(0, TAU), d = rand(0, 0.72 * P.R);
      P.craters.push({ x: P.cx + Math.cos(ang)*d, y: P.cy + Math.sin(ang)*d, r: rand(9, 28) });
    }
    pads = levelDef.pads.map(p => ({ ...p }));
  } else if (levelDef.type === 'float') {
    pads = levelDef.pads.map(p => ({ ...p, w: Math.round(p.w * S.padW),
                                     moving:true, phase: rand(0, TAU) }));
  }
  genAsteroids(levelDef.ast);
  spawnShip();
  setAmbience(levelDef.amb);
  state = 'levelIntro'; stateT = 1.2;
}
function spawnShip() {
  ship.visible = true; ship.flame = 0; landPad = null; trail = [];
  ship.fuel = levelDef.fuel;
  if (levelDef.type === 'planetoid') {
    ship.x = P.cx + 650; ship.y = P.cy - 600;
    ship.vx = 0; ship.vy = 15;
    const dx = P.cx - ship.x, dy = P.cy - ship.y, d = Math.hypot(dx, dy);
    ship.a = Math.atan2(dx/d, -(dy/d));
  } else if (levelDef.type === 'float') {
    const p0 = pads[pads.length - 1] || pads[0];   // 出生在最大的平台上方
    ship.x = clamp(padCX(p0, time) + rand(-200, 200), 100, WORLD_W - 100);
    ship.y = p0.y - S.spawnH;
    ship.vx = rand(-14, 14); ship.vy = 18; ship.a = 0;
  } else {
    const pad = pads[Math.floor(Math.random() * pads.length)];
    const pcx = (pad.x1 + pad.x2) / 2;
    ship.x = clamp(pcx + rand(-450, 450), 60, WORLD_W - 60);
    ship.y = Math.min(pad.y - S.spawnH, heightAt(ship.x) - 150);
    ship.vx = rand(-20, 20); ship.vy = 18; ship.a = 0;
  }
}
/* 出发一关（航线图调用） */
function launch(i) {
  if (runFresh) { score = 0; lives = S.lives; runFresh = false; }
  loadLevel(i);
  sfxBeep(440, 0.1, 'square', 0.12, 660);
}
function gotoMap() {
  state = 'map'; mapStatsOpen = false;
  mapSel = clamp(progress.unlocked, 0, NLV - 1);
  setAmbience(null); releaseAllKeys(); banner = null;
}

/* ---------- 船体几何（V2：更像一枚矢量火箭） ---------- */
const HULL = [[0,-14],[4.5,-4],[11,7],[5,9],[-5,9],[-11,7],[-4.5,-4]];
const SHIP_PTS = [[0,-14],[11,7],[5,9],[-5,9],[-11,7],[4.5,-2],[-4.5,-2]];
function shipPt(px, py) {
  const c = Math.cos(ship.a), s = Math.sin(ship.a);
  return [ship.x + px*c - py*s, ship.y + px*s + py*c];
}
function shipWorldPts() {
  return SHIP_PTS.map(([px, py]) => {
    const [x, y] = shipPt(px, py);
    return { x, y };                          // 必须是 {x,y} 对象：碰撞/陨石/着陆判定都按对象取值
  });
}
function noseDir() { return { x: Math.sin(ship.a), y: -Math.cos(ship.a) }; }

/* ---------- 环境力（引力 + 侧风 + 大气阻力 + 间歇泉）
   物理与轨迹预测共用，保证预测线与实际一致 ---------- */
function envForces(o, dt, t) {
  if (levelDef.type === 'planetoid') {
    const dx = P.cx - o.x, dy = P.cy - o.y, r = Math.max(Math.hypot(dx, dy), P.R*0.85);
    const a = (levelDef.GM * S.gScale) / (r*r);
    o.vx += dx/r * a * dt; o.vy += dy/r * a * dt;
  } else o.vy += levelDef.g * S.gScale * dt;
  const w = levelDef.wind;
  if (w) o.vx += (w.base + w.gust * Math.sin(t * 0.55)) * dt;
  if (levelDef.drag) { const k = Math.exp(-levelDef.drag * dt); o.vx *= k; o.vy *= k; }
  for (const g of geysers) {
    if (geyserState(g, t) !== 'active') continue;
    const dx = o.x - g.x;
    if (Math.abs(dx) < g.w && o.y > g.y - g.h && o.y < g.y + 20)
      o.vy -= g.f * (1 - Math.abs(dx)/g.w) * dt;
  }
}

/* ---------- 轨迹预测（含风/阻力/间歇泉/移动平台） ---------- */
function computePrediction() {
  const pts = []; let impact = null;
  const sim = { x:ship.x, y:ship.y, vx:ship.vx, vy:ship.vy };
  const a = ship.a;
  const thr = keys.up && ship.fuel > 0;
  const dt = 1/40, t0 = time;
  for (let i = 0; i < 160; i++) {
    const t = t0 + i*dt;
    if (thr) { sim.vx += Math.sin(a)*S.thrust*dt; sim.vy -= Math.cos(a)*S.thrust*dt; }
    envForces(sim, dt, t);
    sim.x += sim.vx*dt; sim.y += sim.vy*dt;
    if (i % 5 === 0) pts.push({ x: sim.x, y: sim.y });
    let hit = false;
    if (levelDef.type === 'planetoid') {
      if (dist2(sim.x, sim.y, P.cx, P.cy) <= P.R - 2) hit = true;
    } else if (levelDef.type === 'float') {
      if (sim.y > 1750) hit = true;
      else for (const pd of pads) {
        const cx = padCX(pd, t);
        if (Math.abs(sim.x - cx) <= pd.w/2 && sim.y >= pd.y && sim.y <= pd.y + 12) { hit = true; break; }
      }
    } else if (heightAt(sim.x) <= sim.y) hit = true;
    if (hit) { impact = { x: sim.x, y: sim.y }; break; }
  }
  pred = { pts, impact };
}

/* ---------- 碰撞与着陆判定 ---------- */
function checkContact() {
  const pts = shipWorldPts();
  if (levelDef.type === 'planetoid') {
    for (const p of pts) {
      const d = dist2(p.x, p.y, P.cx, P.cy);
      if (d <= P.R) {
        const nx = (p.x - P.cx)/d, ny = (p.y - P.cy)/d;
        const ang = Math.atan2(p.y - P.cy, p.x - P.cx);
        const onPad = Math.abs(angDiff(ang, -Math.PI/2)) < levelDef.pads[0].arc;
        judgeLanding(p, { x:nx, y:ny }, onPad ? { m: levelDef.pads[0].m } : null);
        return;
      }
    }
  } else if (levelDef.type === 'float') {
    for (const p of pts) for (const pd of pads) {
      const cx = padCX(pd, time);
      if (p.x >= cx - pd.w/2 - 2 && p.x <= cx + pd.w/2 + 2 &&
          p.y >= pd.y && p.y <= pd.y + 16) {
        if (ship.vy < -3) { crash('撞上平台底部'); return; }
        judgeLanding(p, { x:0, y:-1 }, pd);
        return;
      }
    }
  } else {
    for (const p of pts) {
      const gy = heightAt(p.x);
      if (p.y >= gy) {
        const onPad = pads.find(pd => p.x >= pd.x1 - 3 && p.x <= pd.x2 + 3);
        judgeLanding(p, { x:0, y:-1 }, onPad || null);
        return;
      }
    }
  }
}
function judgeLanding(pt, normal, pad) {
  const n = noseDir();
  const align = n.x*normal.x + n.y*normal.y;
  const spd = Math.hypot(ship.vx, ship.vy);
  if (pad && align >= ALIGN_MIN && ship.vy <= S.vyMax && Math.abs(ship.vx) <= S.vxMax) {
    if (levelDef.type === 'planetoid') {
      const d = dist2(ship.x, ship.y, P.cx, P.cy);
      ship.x += normal.x * (P.R + 9 - d); ship.y += normal.y * (P.R + 9 - d);
      ship.a = Math.atan2(normal.x, -normal.y);
    } else if (levelDef.type === 'float') {
      landPad = pad; landOff = ship.x - padCX(pad, time);
      ship.a = 0;
    } else { ship.y = pad.y - 9; ship.a = 0; }
    ship.vx = 0; ship.vy = 0; ship.thrusting = false;
    const gained = 400*pad.m + Math.round(ship.fuel)*5 + Math.max(0, Math.round((50 - spd)*8));
    score += gained;
    if (score > best) { best = score; saveBest(); }
    // 星级：1 基础 + 燃料充足 + 柔和触地
    const starN = clamp(1 + (ship.fuel >= levelDef.fuel*0.35 ? 1 : 0) + (spd <= 20 ? 1 : 0), 1, 3);
    progress.stars[levelIdx] = Math.max(progress.stars[levelIdx], starN);
    progress.unlocked = Math.max(progress.unlocked, Math.min(levelIdx + 1, NLV - 1));
    saveProgress();
    stats.landings++; if (starN === 3) stats.perfects++;
    saveStats();
    const starTxt = '★'.repeat(starN) + '☆'.repeat(3 - starN);
    announce('着陆成功 SOFT LANDING  +' + gained,
             starTxt + ' · 燃料 ×5 加成 · 平台 ×' + pad.m + ' · 剩余燃料 ' + Math.round(ship.fuel),
             '#7dffb0', 2.0);
    sfxLand(); vib(30);
    spawnDust(ship.x, ship.y + 8, 20);
    ship.visible = true;
    setThrustSound(false); lastThrustSnd = false;
    state = 'landed'; stateT = 1.8;
  } else {
    let why = !pad ? '偏离着陆平台' :
              align < ALIGN_MIN ? '着陆姿态过斜' :
              ship.vy > S.vyMax ? '下降速度过快' : '横向速度过大';
    crash(why);
  }
}
function crash(why) {
  ship.visible = false; ship.thrusting = false; ship.flame = 0;
  setThrustSound(false); lastThrustSnd = false;
  lives--; stats.crashes++; saveStats();
  explode(ship.x, ship.y, ship.vx, ship.vy);
  shake = 18; flashA = 0.5; vib(60);
  sfxExplosion();
  announce('坠毁 CRASH · ' + why,
           lives > 0 ? '剩余飞船 ×' + lives : '飞船已耗尽',
           '#ff6b5e', 1.7);
  state = 'crashed'; stateT = 1.7;
}

/* ---------- 特效 ---------- */
function spawnFlame() {
  const n = noseDir();
  const bx = ship.x - n.x*9, by = ship.y - n.y*9;
  for (let i = 0; i < 2; i++) {
    if (particles.length > 700) particles.shift();
    const sp = rand(55, 110), j = rand(-0.5, 0.5);
    particles.push({
      x: bx, y: by,
      vx: -n.x*sp + ship.vx*0.6 + Math.cos(j)*14,
      vy: -n.y*sp + ship.vy*0.6 + Math.sin(j)*14,
      life: rand(0.25, 0.55), max: 0.55, kind: 'jet',
      tint: Math.random() < 0.35 ? '#fff2cf' : '#ffb347' });
  }
}
function spawnRCS(side) {           // side: -1 左喷 / 1 右喷（与转向方向相反）
  const [px, py] = shipPt(side * 5, -8);
  const c = Math.cos(ship.a), s = Math.sin(ship.a);
  const lvx = side * 20, lvy = 0;
  particles.push({ x:px, y:py,
    vx: ship.vx*0.5 + lvx*c - lvy*s, vy: ship.vy*0.5 + lvx*s + lvy*c,
    life: 0.22, max: 0.22, kind: 'dust', tint: '#dfeeff' });
}
function spawnDust(x, y, n) {
  for (let i = 0; i < n; i++) {
    const dir = i % 2 === 0 ? 1 : -1;              // 向两侧卷起
    particles.push({ x, y,
      vx: dir * rand(30, 95), vy: rand(-60, -10),
      life: rand(0.35, 0.8), max: 0.8, kind: 'dust', tint: '#c9d8ff' });
  }
}
function explode(x, y, vx, vy) {
  for (let i = 0; i < 46; i++) {
    const a = rand(0, TAU), sp = rand(40, 230);
    particles.push({ x, y, vx: Math.cos(a)*sp + vx*0.4, vy: Math.sin(a)*sp + vy*0.4,
                     life: rand(0.5, 1.3), max: 1.3, kind: 'boom' });
  }
  particles.push({ x, y, r: 6, life: 0.45, max: 0.45, kind: 'ring' });
  for (let i = 0; i < HULL.length - 1; i++) {
    const [ax, ay] = HULL[i], [bx, by] = HULL[i+1];
    frags.push({ ax, ay, bx, by, x, y,
                 vx: vx*0.3 + rand(-70, 70), vy: vy*0.3 + rand(-70, 70),
                 rot: 0, vr: rand(-4, 4), life: rand(0.9, 1.6), max: 1.6 });
  }
}
function spawnPlumes(dt) {
  for (const g of geysers) {
    if (geyserState(g, time) !== 'active') continue;
    if (particles.length > 650) continue;
    if (Math.random() < dt * 46) {
      particles.push({ x: g.x + rand(-14, 14), y: g.y,
        vx: rand(-12, 12), vy: -rand(90, 175),
        life: rand(0.8, 1.4), max: 1.4, kind: 'plume' });
    }
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.kind === 'ring') { p.r += 260 * dt; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - 1.2*dt); p.vy *= (1 - 1.2*dt);
  }
  for (let i = frags.length - 1; i >= 0; i--) {
    const f = frags[i];
    f.life -= dt;
    if (f.life <= 0) { frags.splice(i, 1); continue; }
    f.x += f.vx*dt; f.y += f.vy*dt; f.rot += f.vr*dt;
    if (terrain) { const gy = heightAt(f.x); if (f.y > gy - 4) { f.vy = -Math.abs(f.vy)*0.4; f.vx *= 0.7; } }
  }
}

/* ---------- 船体物理 ---------- */
function physics(dt) {
  if (keys.left)  ship.a -= ROT * dt;
  if (keys.right) ship.a += ROT * dt;
  if (keys.left !== keys.right && Math.random() < dt * 10)
    spawnRCS(keys.right ? -1 : 1);               // 转向时对侧姿态喷口
  const thr = keys.up && ship.fuel > 0;
  ship.thrusting = thr;
  ship.flame += ((thr ? 1 : 0) - ship.flame) * Math.min(1, dt * 9);
  if (thr) {
    ship.fuel = Math.max(0, ship.fuel - S.burn * dt);
    ship.vx += Math.sin(ship.a) * S.thrust * dt;
    ship.vy -= Math.cos(ship.a) * S.thrust * dt;
    spawnFlame();
  }
  if (thr !== lastThrustSnd) { setThrustSound(thr); lastThrustSnd = thr; }
  if (AC && Math.abs(ship.flame - lastFlame) > 0.04) {
    lastFlame = ship.flame;
    engineLP.frequency.setTargetAtTime(260 + 560 * ship.flame, AC.currentTime, 0.08);
  }
  envForces(ship, dt, time);
  ship.x += ship.vx * dt; ship.y += ship.vy * dt;

  if (levelDef.type === 'planetoid') {
    if (dist2(ship.x, ship.y, P.cx, P.cy) > 5400) {
      spawnShip();
      announce('信号丢失 · 位置已重置', '', '#ffd75e', 1.5);
      return;
    }
  } else {
    if (ship.x < 24)     { ship.x = 24;     ship.vx = Math.abs(ship.vx)*0.5; }
    if (ship.x > WORLD_W-24) { ship.x = WORLD_W-24; ship.vx = -Math.abs(ship.vx)*0.5; }
    if (ship.y < -700)   { ship.y = -700;   ship.vy = Math.max(ship.vy, 0); }
    if (levelDef.type === 'float' && ship.y > 1750) { crash('坠入云层'); return; }
  }

  const pts = shipWorldPts();
  for (const a of asteroids)
    for (const p of pts)
      if (dist2(p.x, p.y, a.x, a.y) < a.r * 0.72) { crash('陨石撞击'); return; }

  warnT += dt;
  if (warnT > 1.15) { warnT = 0;
    if (ship.fuel > 0 && ship.fuel < 22) sfxBeep(196, 0.12, 'square', 0.08); }

  if (S.trail) {
    trailT += dt;
    if (trailT > 0.025) { trailT = 0; trail.push({ x: ship.x, y: ship.y });
      if (trail.length > 34) trail.shift(); }
  }

  computePrediction();
  checkContact();
}

/* ---------- 相机 ---------- */
function clampCamX(x, z) {
  const half = (W*0.5) / z;
  if (half >= WORLD_W/2) return WORLD_W/2;
  return clamp(x, half, WORLD_W - half);
}
function camFollow(dt) {
  let alt;
  if (levelDef.type === 'planetoid') alt = dist2(ship.x, ship.y, P.cx, P.cy) - P.R;
  else if (levelDef.type === 'float')
    alt = Math.max(0, ship.y - Math.min(...pads.map(p => p.y)));
  else alt = heightAt(ship.x) - ship.y;
  const zMin = Math.max(0.20, W / WORLD_W);
  const tz = clamp(Math.min((H*0.58)/(alt + 250), 1.55), zMin, 1.55);
  cam.zoom += (tz - cam.zoom) * Math.min(1, dt*3.0);
  cam.x += (ship.x - cam.x) * Math.min(1, dt*5.0);
  cam.y += (ship.y - 40 - cam.y) * Math.min(1, dt*5.0);
  cam.x = clampCamX(cam.x, cam.zoom);
}

/* ---------- 主更新 ---------- */
function update(dt) {
  time += dt;
  shake = Math.max(0, shake - 44*dt);
  flashA = Math.max(0, flashA - 1.7*dt);
  updateParticles(dt);
  updateAsteroids(dt);
  if (geysers.length && state !== 'map' && state !== 'title') spawnPlumes(dt);
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }

  switch (state) {
    case 'title':
      cam.zoom = Math.max(0.4, W / WORLD_W);
      cam.x = clampCamX(mod(time * 26, WORLD_W), cam.zoom);
      cam.y = 950;
      break;
    case 'map':
      cam.x = time * 12; cam.y = 900; cam.zoom = 0.4;
      break;
    case 'levelIntro':
      camFollow(dt);
      stateT -= dt;
      if (stateT <= 0) { state = 'playing'; if (panelOpen) paused = true; }
      break;
    case 'playing':
      physics(dt);
      camFollow(dt);
      break;
    case 'landed':
      if (landPad && landPad.moving) {           // 骑着浮空平台漂
        ship.x = padCX(landPad, time) + landOff;
        ship.y = landPad.y - 9;
      }
      camFollow(dt);
      stateT -= dt;
      if (stateT <= 0) gotoMap();
      break;
    case 'crashed':
      stateT -= dt;
      if (stateT <= 0) {
        if (lives > 0) { spawnShip(); state = 'levelIntro'; stateT = 0.8; }
        else { state = 'gameover'; runFresh = true; }
      }
      break;
    case 'gameover':
      break;
  }
}

/* ---------- 渲染 ---------- */
function glowStroke(color, width, glowA) {
  ctx.strokeStyle = color;
  ctx.globalAlpha = glowA ?? 0.30;
  ctx.lineWidth = width * 3.4;
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.lineWidth = width;
  ctx.stroke();
}
function drawStars() {
  for (const st of stars) {
    const sx = mod(st.x - cam.x*st.f, W + 2400) - 1200;
    const sy = mod(st.y - cam.y*st.f*0.6, H + 2400) - 1200;
    if (sx < -4 || sx > W+4 || sy < -4 || sy > H+4) continue;
    ctx.globalAlpha = st.a * (0.55 + 0.45*Math.sin(time*1.7 + st.x));
    ctx.fillStyle = '#cfe6ff';
    ctx.fillRect(sx, sy, st.s, st.s);
  }
  ctx.globalAlpha = 1;
}
function drawSky() {
  const th = levelDef.theme;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const s = th.sun;
  const sx = s.x * W, sy = s.y * H;
  const rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, s.r * 4);
  rg.addColorStop(0, s.c); rg.addColorStop(0.25, s.c + '88'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(sx, sy, s.r * 4, 0, TAU); ctx.fill();
  ctx.fillStyle = s.c; ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.arc(sx, sy, s.r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function viewBounds() {
  const z = cam.zoom;
  return { l: cam.x - (W*0.5)/z, r: cam.x + (W*0.5)/z,
           t: cam.y - (H*0.42)/z, b: cam.y + (H*0.58)/z, z };
}
function drawTerrain(v) {
  if (!terrain) return;
  const th = levelDef.theme;
  const x0 = Math.max(0, v.l - 20), x1 = Math.min(WORLD_W, v.r + 20);
  if (x0 >= x1) return;
  const wStep = clamp(14 / v.z, 6, 60);
  const ridge = () => {
    ctx.beginPath();
    ctx.moveTo(x0, heightAt(x0));
    for (let x = x0 + wStep; x < x1; x += wStep) ctx.lineTo(x, heightAt(x));
    ctx.lineTo(x1, heightAt(x1));
  };
  ctx.save();
  ridge();
  ctx.lineTo(x1, v.b + 80); ctx.lineTo(x0, v.b + 80); ctx.closePath();
  ctx.fillStyle = th.fill; ctx.fill();
  ctx.restore();
  ridge();
  glowStroke(th.ridge, 1.6/v.z, 0.22);
  ctx.globalAlpha = 0.07;
  ctx.strokeStyle = th.ridge; ctx.lineWidth = 1/v.z;
  ctx.beginPath();
  for (let x = Math.ceil(x0/48)*48; x < x1; x += 48) {

    ctx.moveTo(x, gy + 8); ctx.lineTo(x, v.b + 60);

  ctx.globalAlpha = 1;

function drawPadLabel(x, y, txt, v) {
  ctx.fillStyle = levelDef.theme.accent;
  ctx.font = `${Math.round(13/v.z)}px 'Courier New',monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, x, y);
}
function drawChevron(x, y, v) {
  const bob = Math.sin(time*3)*6/v.z;
  ctx.strokeStyle = '#59ffc8'; ctx.globalAlpha = 0.75; ctx.lineWidth = 1.6/v.z;
  ctx.beginPath();
  const s = 9/v.z;
  for (let k = 0; k < 2; k++) {
    ctx.moveTo(x - s, y + bob - k*s*0.8);
    ctx.lineTo(x,     y + bob + s*0.5 - k*s*0.8);
    ctx.lineTo(x + s, y + bob - k*s*0.8);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawPads(v) {
  const th = levelDef.theme;
  if (levelDef.type === 'planetoid') {
    const arc = levelDef.pads[0].arc;
    ctx.beginPath();
    ctx.arc(P.cx, P.cy, P.R, -Math.PI/2 - arc, -Math.PI/2 + arc);
    glowStroke(th.accent, 2.4/v.z, 0.35);
    for (const s of [-1, 1]) {
      const a = -Math.PI/2 + s*arc;
      const bx = P.cx + Math.cos(a)*P.R, by = P.cy + Math.sin(a)*P.R;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(P.cx + Math.cos(a)*(P.R+12/v.z), P.cy + Math.sin(a)*(P.R+12/v.z));
      glowStroke(th.accent, 1.4/v.z, 0.3);
      const bl = 0.5 + 0.5*Math.sin(time*4);
      ctx.globalAlpha = bl; ctx.fillStyle = '#ff5c5c';
      ctx.beginPath(); ctx.arc(bx, by, 3/v.z, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    drawPadLabel(P.cx, P.cy - P.R - 22/v.z, '×5', v);
    drawChevron(P.cx, P.cy - P.R - 60/v.z, v);
    return;
  }
  for (const p of pads) {
    const cx = padCX(p, time);
    if (!Number.isFinite(cx)) continue;
    const x1 = cx - p.w/2, x2 = cx + p.w/2;
    if (x2 < v.l - 60 || x1 > v.r + 60) continue;
    ctx.beginPath(); ctx.moveTo(x1, p.y); ctx.lineTo(x2, p.y);
    glowStroke(th.accent, 2.6/v.z, 0.4);
    if (p.moving) {                                 // 浮空平台下方的悬浮喷流
      for (const gx of [x1 + p.w*0.2, x2 - p.w*0.2]) {
        const fl = 6 + Math.sin(time*30 + gx)*2.5;
        ctx.globalAlpha = 0.5; ctx.strokeStyle = '#9fd8ff'; ctx.lineWidth = 2/v.z;
        ctx.beginPath(); ctx.moveTo(gx, p.y + 3); ctx.lineTo(gx, p.y + 3 + fl); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
    for (const bx of [x1, x2]) {
      ctx.beginPath(); ctx.moveTo(bx, p.y); ctx.lineTo(bx, p.y - 10/v.z);
      glowStroke(th.accent, 1.4/v.z, 0.3);
      const bl = 0.5 + 0.5*Math.sin(time*4 + bx);
      ctx.globalAlpha = bl; ctx.fillStyle = '#ff5c5c';
      ctx.beginPath(); ctx.arc(bx, p.y - 12/v.z, 3/v.z, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    drawPadLabel(cx, p.y - 22/v.z, '×'+p.m, v);
    drawChevron(cx, p.y - 56/v.z, v);
  }
}
function drawGeysers(v) {
  for (const g of geysers) {
    const st = geyserState(g, time);
    // 喷口
    ctx.fillStyle = 'rgba(30,18,4,.9)';
    ctx.beginPath();
    ctx.moveTo(g.x - 16, g.y + 4); ctx.lineTo(g.x - 6, g.y - 10);
    ctx.lineTo(g.x + 6, g.y - 10); ctx.lineTo(g.x + 16, g.y + 4);
    ctx.closePath(); ctx.fill();
    if (st === 'warn') {                            // 喷发预警黄光
      const bl = 0.35 + 0.35*Math.sin(time*10);
      ctx.globalAlpha = bl; ctx.fillStyle = '#ffd75e';
      ctx.beginPath(); ctx.arc(g.x, g.y - 26, 22, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (st === 'active') {
      ctx.globalAlpha = 0.75; ctx.fillStyle = '#ff9b4a';
      ctx.beginPath(); ctx.arc(g.x, g.y - 8, 12, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}
function drawCloudBands(v) {                        // 木星云带
  const bands = [
    { y: 260, h: 130, c: '#e8caa0' }, { y: 500, h: 120, c: '#c89868' },
    { y: 740, h: 140, c: '#e8caa0' }, { y: 990, h: 130, c: '#a87850' },
    { y: 1230, h: 130, c: '#e8caa0' }, { y: 1470, h: 120, c: '#c89868' },
  ];
  for (const b of bands) {
    ctx.globalAlpha = 0.10; ctx.fillStyle = b.c;
    ctx.fillRect(v.l - 100, b.y, (v.r - v.l) + 200, b.h);
  }
  ctx.globalAlpha = 0.16; ctx.fillStyle = 'rgba(200,80,50,1)';
  ctx.beginPath(); ctx.ellipse(2600, 1180, 220, 90, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawPlanetoid(v) {
  if (!P) return;
  ctx.setLineDash([10/v.z, 14/v.z]);
  ctx.strokeStyle = '#b48cff'; ctx.globalAlpha = 0.16; ctx.lineWidth = 1.2/v.z;
  for (const rr of [P.R + 260, P.R + 620]) {
    ctx.beginPath(); ctx.arc(P.cx, P.cy, rr, 0, TAU); ctx.stroke();
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(P.cx, P.cy, P.R, 0, TAU);
  ctx.fillStyle = 'rgba(38,28,66,0.85)'; ctx.fill();
  glowStroke('#c9b1ff', 2/v.z, 0.3);
  ctx.strokeStyle = '#8f7cc4'; ctx.globalAlpha = 0.4; ctx.lineWidth = 1.4/v.z;
  for (const c of P.craters) { ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.stroke(); }
  ctx.globalAlpha = 1;
}
function drawAsteroids(v) {
  ctx.strokeStyle = levelDef.theme.ridge; ctx.lineWidth = 1.5/v.z;
  for (const a of asteroids) {
    if (a.x < v.l - 80 || a.x > v.r + 80) continue;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    for (let k = 0; k <= 10; k++) {
      const ang = k/10 * TAU + a.rot, rr = a.verts[k % 10];
      const px = a.x + Math.cos(ang)*rr, py = a.y + Math.sin(ang)*rr;
      k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.globalAlpha = 0.16;
    ctx.lineWidth = 7/v.z; ctx.stroke();
    ctx.lineWidth = 1.5/v.z; ctx.globalAlpha = 1;
  }
}
function drawParticles() {
  for (const p of particles) {
    const t = clamp(p.life / p.max, 0, 1);
    if (p.kind === 'ring') {
      ctx.globalAlpha = t * 0.8;
      ctx.strokeStyle = '#ffd7a0'; ctx.lineWidth = 2.5/cam.zoom;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
      continue;
    }
    ctx.globalAlpha = t;
    ctx.strokeStyle = p.kind === 'plume' ? (t > 0.5 ? '#ffb347' : '#ff6b3d') :
                      p.kind === 'boom' ? (t > 0.5 ? '#ffe9b0' : '#ff6b3d') :
                      p.kind === 'dust' ? (p.tint || '#c9d8ff') : (p.tint || '#ffb347');
    ctx.lineWidth = 1.8/cam.zoom;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx*0.03, p.y - p.vy*0.03);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawFrags() {
  ctx.strokeStyle = '#e8f4ff';
  for (const f of frags) {
    const c = Math.cos(f.rot), s = Math.sin(f.rot);
    const t1x = f.x + f.ax*c - f.ay*s, t1y = f.y + f.ax*s + f.ay*c;
    const t2x = f.x + f.bx*c - f.by*s, t2y = f.y + f.bx*s + f.by*c;
    ctx.globalAlpha = clamp(f.life/f.max, 0, 1);
    ctx.lineWidth = 1.8/cam.zoom;
    ctx.beginPath(); ctx.moveTo(t1x, t1y); ctx.lineTo(t2x, t2y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawPrediction() {
  if (state !== 'playing' || !pred.pts.length) return;
  ctx.fillStyle = '#59ffc8';
  for (const p of pred.pts) {
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2/cam.zoom, 0, TAU); ctx.fill();
  }
  if (pred.impact) {
    ctx.globalAlpha = 0.9; ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 2/cam.zoom;
    const s = 7/cam.zoom, q = pred.impact;
    ctx.beginPath();
    ctx.moveTo(q.x-s, q.y-s); ctx.lineTo(q.x+s, q.y+s);
    ctx.moveTo(q.x+s, q.y-s); ctx.lineTo(q.x-s, q.y+s);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawTrail() {
  if (!S.trail || trail.length < 2) return;
  ctx.strokeStyle = '#59ffc8'; ctx.lineWidth = 1.2/cam.zoom;
  for (let i = 1; i < trail.length; i++) {
    ctx.globalAlpha = (i / trail.length) * 0.28;
    ctx.beginPath();
    ctx.moveTo(trail[i-1].x, trail[i-1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawShip() {
  if (!ship.visible) return;
  drawTrail();
  if (ship.flame > 0.05) {                          // 四层尾焰 + 马赫环
    const len = (10 + 10*ship.flame) * (0.85 + 0.3*Math.abs(Math.sin(time*38)));
    const [lx, ly] = shipPt(-2.6, 9), [rx, ry] = shipPt(2.6, 9);
    const [ax, ay] = shipPt(rand(-0.8, 0.8), 9 + len);
    const layers = [
      ['#ff7b39', 2.6, 1.0, 0.5],
      ['#ffb347', 1.8, 0.72, 0.75],
      ['#fff7d6', 1.1, 0.42, 1.0],
    ];
    for (const [col, w, k, al] of layers) {
      const [mx, my] = shipPt(0, 9 + len*k);
      ctx.globalAlpha = al;
      ctx.strokeStyle = col; ctx.lineWidth = w/cam.zoom;
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(mx, my); ctx.lineTo(rx, ry);
      ctx.closePath(); ctx.stroke();
    }
    ctx.globalAlpha = 0.8; ctx.strokeStyle = '#ffd75e'; ctx.lineWidth = 1/cam.zoom;
    for (const kk of [0.35, 0.6]) {
      const [d1x, d1y] = shipPt(0, 9 + len*kk - 1.6);
      const [d2x, d2y] = shipPt(0, 9 + len*kk + 1.6);
      const [m1x, m1y] = shipPt(1.4, 9 + len*kk);
      const [m2x, m2y] = shipPt(-1.4, 9 + len*kk);
      ctx.beginPath();
      ctx.moveTo(d1x, d1y); ctx.lineTo(m1x, m1y); ctx.lineTo(d2x, d2y);
      ctx.lineTo(m2x, m2y); ctx.closePath(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // 机身
  ctx.beginPath();
  HULL.forEach(([px, py], i) => {
    const [wx, wy] = shipPt(px, py);
    i === 0 ? ctx.moveTo(wx, wy) : ctx.lineTo(wx, wy);
  });
  ctx.closePath();
  glowStroke('#e8f4ff', 1.8/cam.zoom, 0.35);
  // 中脊线 + 座舱
  const [s1x, s1y] = shipPt(0, -14), [s2x, s2y] = shipPt(0, 8.5);
  ctx.globalAlpha = 0.5; ctx.strokeStyle = '#e8f4ff'; ctx.lineWidth = 0.9/cam.zoom;
  ctx.beginPath(); ctx.moveTo(s1x, s1y); ctx.lineTo(s2x, s2y); ctx.stroke();
  const [c1x, c1y] = shipPt(-2.5, -5), [c2x, c2y] = shipPt(0, -9.5), [c3x, c3y] = shipPt(2.5, -5);
  ctx.beginPath(); ctx.moveTo(c1x, c1y); ctx.lineTo(c2x, c2y); ctx.lineTo(c3x, c3y); ctx.stroke();
  ctx.globalAlpha = 1;
  // 翼尖航行灯：左红右绿交替闪烁
  const on = (time*2.5) % 1 < 0.55;
  for (const [side, col] of [[-1, '#ff5c5c'], [1, '#59ff7a']]) {
    const [nx, ny] = shipPt(side*11, 7);
    const lit = on ? 0.95 : 0.25;
    ctx.globalAlpha = lit; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(nx, ny, 1.7/cam.zoom, 0, TAU); ctx.fill();
    ctx.globalAlpha = lit * 0.35;
    ctx.beginPath(); ctx.arc(nx, ny, 4/cam.zoom, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function drawWorld() {
  const v = viewBounds();
  if (levelDef.type === 'float') drawCloudBands(v);
  drawPlanetoid(v);
  drawTerrain(v);
  drawGeysers(v);
  drawPads(v);
  drawAsteroids(v);
  drawPrediction();
  drawParticles();
  drawFrags();
  drawShip();
}

/* ---------- HUD ---------- */
function fmt(v, w) {
  const s = Math.round(Math.abs(v));
  return (v < 0 ? '-' : '+') + String(s).padStart(w, '0');
}
function hudText(txt, x, y, size, color, align) {
  ctx.fillStyle = color; ctx.font = `${size}px 'Courier New',monospace`;
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
  ctx.fillText(txt, x, y);
}
function drawMiniShip(x, y, s, on) {
  ctx.globalAlpha = on ? 0.95 : 0.22;
  ctx.strokeStyle = on ? '#9df' : '#667';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(x, y - 7*s);
  ctx.lineTo(x + 2*s, y - 2*s);
  ctx.lineTo(x + 5.5*s, y + 3.5*s);
  ctx.lineTo(x + 2*s, y + 4.5*s);
  ctx.lineTo(x - 2*s, y + 4.5*s);
  ctx.lineTo(x - 5.5*s, y + 3.5*s);
  ctx.lineTo(x - 2*s, y - 2*s);
  ctx.closePath(); ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawHUD() {
  if (state === 'title' || state === 'map') return;
  hudText('SCORE ' + String(score).padStart(6, '0'), 18, 14, 15, '#e8f4ff');
  hudText('STATION ' + (levelIdx+1) + '/' + NLV + ' · ' + levelDef.body, 18, 36, 12, '#7fb0d8');
  for (let i = 0, lx = W - 46 - S.lives*26; i < S.lives; i++)
    drawMiniShip(lx + i*26, 26, 1.5, i < lives);
  hudText(muted ? '♪×' : '♪', W - 26, 14, 15, muted ? '#556' : '#7fb0d8', 'right');

  const fw = 170, fr = ship.fuel / levelDef.fuel;
  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = '#56d9ff'; ctx.lineWidth = 1; ctx.strokeRect(18, H-40, fw, 12);
  ctx.fillStyle = fr > 0.5 ? '#56d9ff' : fr > 0.25 ? '#ffb347' :
                  (Math.sin(time*8) > 0 ? '#ff4d4d' : '#802020');
  ctx.fillRect(19, H-39, (fw-2) * fr, 10);
  ctx.globalAlpha = 1;
  hudText('FUEL ' + String(Math.round(ship.fuel)).padStart(3, '0'), 18, H-58, 12,
          fr < 0.25 ? '#ff6b5e' : '#7fb0d8');

  let alt;
  if (levelDef.type === 'planetoid') alt = dist2(ship.x, ship.y, P.cx, P.cy) - P.R;
  else if (levelDef.type === 'float') alt = Math.max(0, ship.y - Math.min(...pads.map(p => p.y)));
  else alt = Math.max(0, heightAt(ship.x) - ship.y);
  const vyDanger = alt < 300 && ship.vy > S.vyMax;
  const vxDanger = Math.abs(ship.vx) > S.vxMax && alt < 300;
  hudText('ALT ' + String(Math.round(alt)).padStart(4, '0'), W-18, H-82, 13, '#9df', 'right');
  hudText('VX ' + fmt(ship.vx, 3), W-18, H-60, 13, vxDanger ? '#ff4d4d' : '#9df', 'right');
  hudText('VY ' + fmt(ship.vy, 3), W-18, H-38, 13, vyDanger ? '#ff4d4d' : '#9df', 'right');

  if (levelDef.wind) {                               // 侧风指示
    const w = levelDef.wind.base + levelDef.wind.gust * Math.sin(time*0.55);
    const cx = W/2;
    ctx.globalAlpha = 0.85;
    hudText('风 WIND', cx - 30, 14, 12, '#ffb347', 'right');
    ctx.fillStyle = '#ffb347';
    const dir = w >= 0 ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(cx - 6 + dir*10, 20); ctx.lineTo(cx - 2 - dir*4, 14);
    ctx.lineTo(cx - 2 - dir*4, 26); ctx.closePath(); ctx.fill();
    hudText(Math.abs(w).toFixed(0), cx + 4, 14, 13, '#ffb347');
    ctx.globalAlpha = 1;
  }
  if (levelDef.drag)
    hudText('ATM 大气', W/2, 36, 11, '#9db8d8', 'center');

  if (ship.fuel <= 0 && state === 'playing')
    hudText('NO FUEL 燃料耗尽', W/2, 66, 15, Math.sin(time*7)>0 ? '#ff4d4d' : '#701c1c', 'center');
  else if (ship.fuel < 22 && state === 'playing')
    hudText('LOW FUEL 低燃料', W/2, 66, 14, Math.sin(time*6)>0 ? '#ffb347' : '#6b4a10', 'center');

  if (state === 'playing') {                         // 屏幕外平台方向箭头
    let bestP = null, bd = 1e9;
    for (const p of pads) {
      const cx = padCX(p, time);
      if (!Number.isFinite(cx)) continue;
      const d = dist2(ship.x, ship.y, cx, p.y);
      if (d < bd) { bd = d; bestP = p; }
    }
    if (bestP) {
      const px = padCX(bestP, time), py = bestP.y;
      const sx = (px - cam.x)*cam.zoom + W*0.5, sy = (py - cam.y)*cam.zoom + H*0.42;
      if (sx < 30 || sx > W-30 || sy < 40 || sy > H-90) {
        const ang = Math.atan2(py - ship.y, px - ship.x);
        const ex = W/2 + Math.cos(ang) * Math.min(W, H)*0.36;
        const ey = H*0.45 + Math.sin(ang) * Math.min(W, H)*0.36;
        ctx.save();
        ctx.translate(clamp(ex, 34, W-34), clamp(ey, 46, H-100));
        ctx.rotate(ang);
        ctx.globalAlpha = 0.85; ctx.fillStyle = levelDef.theme.accent;
        ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-7, -7); ctx.lineTo(-7, 7);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        hudText('×'+bestP.m, clamp(ex, 34, W-34), clamp(ey, 46, H-100) + 12, 11,
                levelDef.theme.accent, 'center');
        ctx.globalAlpha = 1;
      }
    }
  }
}
function drawBanner() {

  ctx.globalAlpha = clamp(a, 0, 1);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = banner.color; ctx.shadowBlur = 16;

  ctx.shadowBlur = 0;
  if (banner.l2) {
    ctx.font = "14px 'Courier New',monospace";
    ctx.fillStyle = '#9db8d8';
    ctx.fillText(banner.l2, W/2, H*0.30 + 34);
  }

}
function centerText(txt, y, size, color, bold) {

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

function drawOverlays() {

}
function drawTitle() {
  ctx.fillStyle = 'rgba(3,6,14,0.35)'; ctx.fillRect(0, 0, W, H);
  ctx.shadowColor = '#56d9ff'; ctx.shadowBlur = 26;
  centerText('VECTOR LANDER', H*0.24, Math.min(64, W*0.09), '#e8f4ff', true);
  ctx.shadowBlur = 0;
  centerText('矢 量 着 陆 · 太 阳 系 航 线', H*0.24 + Math.min(52, W*0.075), 22, '#56d9ff');
  centerText('向 Spacewar! · Lunar Lander · Asteroids 致敬', H*0.38, 13, '#7fb0d8');
  const L = [
    '← → 旋转机头（或 A / D）    ↑ / W / 空格 主引擎',
    'G 调参数 · P 暂停 · M 静音 · R 重开 · ESC 返回航线图',
    '目标：以足够慢的速度、直立姿态降落在发光平台上',
    '惯性真实存在 —— 松开按键后你会继续漂移',
  ];
  L.forEach((t, i) => centerText(t, H*0.48 + i*24, 14, i < 2 ? '#9db8d8' : '#ffd75e'));
  if (best > 0) centerText('最佳航行 ' + best, H*0.64, 14, '#7dffb0');
  if (Math.sin(time*3.2) > -0.25)
    centerText('— 按任意键 / 点击屏幕 进入航线图 —', H*0.72, 18, '#e8f4ff', true);
  centerText('纯 Canvas 手写牛顿力学 · 零依赖 · 支持触屏', H*0.92, 12, '#556a88');
}

/* ---------- 航线图 ---------- */
function mapNodePos(i) {
  return { x: W * (0.085 + 0.83 * i / (NLV - 1)),
           y: H * 0.55 + Math.sin(i * 0.85 + 1.2) * H * 0.10 };
}
const BODY_COLORS = ['#b8c4d4','#a8b4c8','#8894ac','#7a6a5a','#d86a3a',
                     '#9a86c8','#e8c04a','#a8dce8','#d8a86a','#c8ccd8'];
function drawBodyIcon(x, y, i, unlocked) {
  const col = unlocked ? BODY_COLORS[i] : '#1a2233';
  ctx.globalAlpha = unlocked ? 1 : 0.5;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, 16, 0, TAU); ctx.fill();
  ctx.strokeStyle = unlocked ? '#e8f4ff' : '#3a4a66';
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(x, y, 16, 0, TAU); ctx.stroke();
  ctx.globalAlpha = unlocked ? 0.7 : 0.3;
  if (i <= 2) {                                       // 月球：环形山
    ctx.strokeStyle = '#5a6a84';
    ctx.beginPath(); ctx.arc(x-5, y-4, 4, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(x+6, y+3, 3, 0, TAU); ctx.stroke();
  } else if (i === 3) {                               // 小行星带：碎石
    ctx.fillStyle = '#5a4e42';
    for (const [dx, dy, r] of [[-26,-8,3],[22,-14,2.5],[18,12,3.5],[-20,14,2]]) {
      ctx.beginPath(); ctx.arc(x+dx, y+dy, r, 0, TAU); ctx.fill();
    }
  } else if (i === 4) {                               // 火星：极冠
    ctx.fillStyle = '#f0e8e0';
    ctx.beginPath(); ctx.ellipse(x, y-9, 6, 3, 0, 0, TAU); ctx.fill();
  } else if (i === 5) {                               // 火卫一：引力环
    ctx.strokeStyle = '#b48cff';
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(x, y, 24, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  } else if (i === 6) {                               // 木卫一：火山斑
    ctx.fillStyle = '#ff7b39';
    for (const [dx, dy] of [[-6,-3],[7,5],[2,-8]]) {
      ctx.beginPath(); ctx.arc(x+dx, y+dy, 2.5, 0, TAU); ctx.fill();
    }
  } else if (i === 7) {                               // 木卫二：冰裂纹
    ctx.strokeStyle = '#5ab8d8';
    ctx.beginPath(); ctx.moveTo(x-12, y-6); ctx.lineTo(x-2, y+2); ctx.lineTo(x+10, y-4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-8, y+8); ctx.lineTo(x+4, y+10); ctx.stroke();
  } else if (i === 8) {                               // 木星：云带
    ctx.strokeStyle = '#a87850';
    for (const dy of [-6, 0, 6]) {
      ctx.beginPath(); ctx.moveTo(x-14, y+dy); ctx.lineTo(x+14, y+dy); ctx.stroke();
    }
  } else {                                            // 冥王星：心形平原
    ctx.fillStyle = '#e8ecf4';
    ctx.beginPath(); ctx.ellipse(x+2, y+2, 6, 5, 0.4, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (!unlocked) {                                    // 锁
    ctx.strokeStyle = '#6a7a96'; ctx.lineWidth = 1.4;
    ctx.strokeRect(x-5, y-2, 10, 8);
    ctx.beginPath(); ctx.arc(x, y-3, 4, Math.PI, 0); ctx.stroke();
  }
}
function drawMap() {
  ctx.fillStyle = 'rgba(3,6,14,0.5)'; ctx.fillRect(0, 0, W, H);
  centerText('太 阳 系 航 线 · SOLAR TOUR', H*0.12, 26, '#e8f4ff', true);
  centerText('本次航行 ' + score + ' · 最佳航行 ' + best + ' · 飞船 ×' + lives, H*0.19, 14, '#9db8d8');
  const allDone = progress.stars.every(s => s >= 1);
  if (allDone) {
    const a = 0.6 + 0.4*Math.sin(time*3);
    ctx.globalAlpha = a;
    centerText('★ 太阳系征服完成 ★', H*0.26, 18, '#ffd75e', true);
    ctx.globalAlpha = 1;
  }
  // 航线虚线
  ctx.setLineDash([6, 8]);
  ctx.strokeStyle = '#3a5a7a'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < NLV; i++) {
    const p = mapNodePos(i);
    i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  for (let i = 0; i < NLV; i++) {
    const p = mapNodePos(i);
    const unlocked = i <= progress.unlocked || S.unlockAll;
    if (i === mapSel) {
      const pr = 22 + 2.5*Math.sin(time*4);
      ctx.strokeStyle = '#59ffc8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, TAU); ctx.stroke();
    }
    drawBodyIcon(p.x, p.y, i, unlocked);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = unlocked ? '#e8f4ff' : '#556a88';
    ctx.font = "13px 'Courier New','Microsoft YaHei',monospace";
    ctx.fillText(LEVELS[i].body, p.x, p.y + 24);
    ctx.font = "10px 'Courier New',monospace";
    ctx.fillStyle = '#7fb0d8';
    ctx.fillText((i+1) + '·' + LEVELS[i].name.split(' · ')[0], p.x, p.y + 42);
    const st = progress.stars[i];
    ctx.fillStyle = st > 0 ? '#ffd75e' : '#44526a';
    ctx.font = "14px 'Courier New',monospace";
    ctx.fillText(st > 0 ? '★'.repeat(st) + '☆'.repeat(3 - st) : '☆☆☆', p.x, p.y + 58);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
  centerText('← → 选择 · 空格 / 点击 出发 · S 统计 · ESC 标题', H*0.90, 14, '#7fb0d8');
  if (mapStatsOpen) {
    ctx.fillStyle = 'rgba(3,6,14,0.5)'; ctx.fillRect(0, 0, W, H);
    const px = W/2, py = H/2;
    ctx.fillStyle = 'rgba(8,14,28,.95)';
    ctx.fillRect(px-170, py-110, 340, 220);
    ctx.strokeStyle = 'rgba(120,220,255,.4)'; ctx.lineWidth = 1;
    ctx.strokeRect(px-170, py-110, 340, 220);
    centerText('航 行 统 计', py-80, 18, '#e8f4ff', true);
    centerText('成功着陆 ' + stats.landings, py-40, 15, '#bfe0ff');
    centerText('坠毁 ' + stats.crashes, py-10, 15, '#ff9b8e');
    centerText('完美着陆（三星）' + stats.perfects, py+20, 15, '#7dffb0');
    centerText('最佳航行 ' + best, py+50, 15, '#ffd75e');
    centerText('按 S 关闭', py+86, 12, '#7fb0d8');
  }
}
function mapHitTest(x, y) {
  for (let i = 0; i < NLV; i++) {
    const p = mapNodePos(i);
    if (dist2(x, y, p.x, p.y) < 30) return i;
  }
  return null;
}

/* ---------- 设置面板 ---------- */
const PANEL_ROWS = [
  { key:'gScale', name:'重力倍率',      min:30,  max:150, step:5,
    toSlider:v => v*100, fromSlider:v => v/100, fmt:v => Math.round(v*100) + '%（含引力井）' },
  { key:'thrust', name:'主引擎推力',    min:25,  max:70,  step:1,   fmt:v => String(v) },
  { key:'burn',   name:'燃料消耗 / 秒', min:2,   max:14,  step:0.5, fmt:v => String(v) },
  { key:'vyMax',  name:'安全下降速度',  min:15,  max:60,  step:1,   fmt:v => '≤ ' + v },
  { key:'vxMax',  name:'安全横移速度',  min:8,   max:45,  step:1,   fmt:v => '≤ ' + v },
  { key:'padW',   name:'平台宽度倍率',  min:100, max:250, step:5,
    toSlider:v => v*100, fromSlider:v => v/100, fmt:v => Math.round(v*100) + '%（下关生效）' },
  { key:'spawnH', name:'初始离地高度',  min:150, max:900, step:10,  fmt:v => v + '（按 R 重开生效）' },
  { key:'lives',  name:'飞船数量',      min:2,   max:8,   step:1,   fmt:v => v + ' 条（立即生效）' },
];
const PANEL_CHECKS = [
  { key:'trail',     name:'飞行拖尾' },
  { key:'unlockAll', name:'解锁全部关卡' },
  { key:'shake',     name:'屏幕震动' },
];
let panelOpen = false;
function refreshPanel() {
  for (const d of PANEL_ROWS) {
    d.inpEl.value = d.toSlider ? d.toSlider(S[d.key]) : S[d.key];
    d.valEl.textContent = d.fmt(S[d.key]);
  }
  for (const d of PANEL_CHECKS) d.inpEl.checked = !!S[d.key];
}
function buildPanel() {
  const rows = document.getElementById('panelRows');
  for (const d of PANEL_ROWS) {
    const row = document.createElement('div'); row.className = 'prow';
    const lab = document.createElement('label');
    const nm = document.createElement('span'); nm.textContent = d.name;
    const val = document.createElement('span');
    lab.appendChild(nm); lab.appendChild(val);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = d.min; inp.max = d.max; inp.step = d.step;
    inp.addEventListener('input', () => {
      const raw = parseFloat(inp.value);
      S[d.key] = d.fromSlider ? d.fromSlider(raw) : raw;
      if (d.key === 'lives') lives = S.lives;        // 飞船数量立即生效
      val.textContent = d.fmt(S[d.key]);
      saveCfg();
    });
    row.appendChild(lab); row.appendChild(inp); rows.appendChild(row);
    d.inpEl = inp; d.valEl = val;
  }
  for (const d of PANEL_CHECKS) {
    const row = document.createElement('div'); row.className = 'crow';
    const nm = document.createElement('span'); nm.textContent = d.name;
    const inp = document.createElement('input');
    inp.type = 'checkbox';
    inp.addEventListener('change', () => { S[d.key] = inp.checked; saveCfg(); });
    row.appendChild(nm); row.appendChild(inp); rows.appendChild(row);
    d.inpEl = inp;
  }
  refreshPanel();
}
function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('panel').hidden = !panelOpen;
  if (panelOpen && state === 'playing') paused = true;
  if (!panelOpen) {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    paused = false;
  }
}
document.getElementById('gear').addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit(); togglePanel();
});
document.getElementById('btnClose').addEventListener('click', togglePanel);
document.getElementById('btnReset').addEventListener('click', () => {
  S = { ...S_DEF }; saveCfg(); refreshPanel(); lives = S.lives;
});
buildPanel();

/* ---------- 输入 ---------- */
function releaseAllKeys() {
  keys.left = false; keys.right = false; keys.up = false;
  setThrustSound(false); lastThrustSnd = false;
}
window.addEventListener('keydown', e => {
  audioInit();
  const c = e.code;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c)) e.preventDefault();
  if (c === 'KeyG') { togglePanel(); return; }
  if (panelOpen) return;
  if (c === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; return; }
  if (c === 'ArrowLeft'  || c === 'KeyA') keys.left  = true;
  if (c === 'ArrowRight' || c === 'KeyD') keys.right = true;
  if (c === 'ArrowUp'    || c === 'KeyW' || c === 'Space') keys.up = true;
  if (c === 'Escape') {
    if (state === 'map') state = 'title';
    else if (state !== 'title') gotoMap();
    return;
  }
  if (state === 'map') {
    if (c === 'ArrowLeft')  mapSel = clamp(mapSel - 1, 0, NLV - 1);
    else if (c === 'ArrowRight') mapSel = clamp(mapSel + 1, 0, NLV - 1);
    else if (c === 'Space' || c === 'Enter') launch(mapSel);
    else if (c === 'KeyS') mapStatsOpen = !mapStatsOpen;
    return;
  }
  if (state === 'title')   { gotoMap(); return; }
  if (state === 'gameover'){ gotoMap(); return; }
  if (state === 'landed')  { gotoMap(); return; }
  if (state === 'playing') {
    if (c === 'KeyP') {
      paused = !paused;
      if (paused) { setThrustSound(false); lastThrustSnd = false; }
      return;
    }
    if (c === 'KeyR') { spawnShip(); announce('已重置本关位置', '', '#ffd75e', 1.2); }
  }
});
window.addEventListener('keyup', e => {
  const c = e.code;
  if (c === 'ArrowLeft'  || c === 'KeyA') keys.left  = false;
  if (c === 'ArrowRight' || c === 'KeyD') keys.right = false;
  if (c === 'ArrowUp'    || c === 'KeyW' || c === 'Space') keys.up = false;
});
cvs.addEventListener('pointerdown', e => {
  audioInit();
  if (state === 'title') { gotoMap(); return; }
  if (state === 'map') {
    const hit = mapHitTest(e.clientX, e.clientY);
    if (hit === null) return;
    if (hit === mapSel) launch(hit); else mapSel = hit;
    return;
  }
  if (state === 'landed' || state === 'gameover') { gotoMap(); return; }
});
window.addEventListener('blur', releaseAllKeys);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) releaseAllKeys();
});

function bindTouch(id, key) {
  const el = document.getElementById(id);
  const on  = e => { e.preventDefault(); audioInit(); keys[key] = true; el.classList.add('active');
                     if (state === 'title') gotoMap();
                     else if (state === 'map') launch(mapSel);
                     else if (state === 'landed' || state === 'gameover') gotoMap(); };
  const off = e => { e.preventDefault(); keys[key] = false; el.classList.remove('active'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
bindTouch('btnL', 'left'); bindTouch('btnR', 'right'); bindTouch('btnT', 'up');

/* ---------- 主循环（固定步长积分 120Hz） ---------- */
const FIXED = 1/120;
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  if (!paused) {
    acc += dt;
    let n = 0;
    while (acc >= FIXED && n < 12) { update(FIXED); acc -= FIXED; n++; }
  } else last = now;
  render();
  requestAnimationFrame(frame);
}

/* ---------- 渲染入口 ---------- */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#050810'; ctx.fillRect(0, 0, W, H);
  if (state === 'map') {
    drawStars();
    drawMap();
    if (vig) { ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H); }
    return;
  }
  drawSky();
  drawStars();
  const sx = (Math.random()*2-1) * shake * (S.shake ? 1 : 0);
  const sy = (Math.random()*2-1) * shake * (S.shake ? 1 : 0);
  ctx.save();
  ctx.translate(W*0.5 + sx, H*0.42 + sy);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);
  drawWorld();
  ctx.restore();
  drawHUD();
  drawBanner();
  drawOverlays();
  if (flashA > 0) {
    ctx.fillStyle = `rgba(255,120,80,${flashA*0.5})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (vig) { ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H); }
}

/* ---------- 测试钩子（不影响游戏） ---------- */
window.game = {
  get state() { return state; }, get score() { return score; },
  get lives() { return lives; }, get level() { return levelIdx; },
  get ship() { return ship; }, get pads() { return pads; }, get P() { return P; },
  get asteroids() { return asteroids; }, get geysers() { return geysers; },
  get levelDef() { return levelDef; }, get cam() { return cam; },
  get settings() { return S; }, get progress() { return progress; },
  get stats() { return stats; }, get mapSel() { return mapSel; },
  get best() { return best; },
  teleport(x, y, vx = 0, vy = 0, a = 0) {
    if (state === 'levelIntro') state = 'playing';
    ship.x = x; ship.y = y; ship.vx = vx; ship.vy = vy; ship.a = a;
    ship.fuel = Math.max(ship.fuel, 30); ship.visible = true;
  },
  jump(n) {
    score = 0; lives = S.lives; runFresh = false;
    loadLevel(clamp(n, 0, NLV - 1)); state = 'playing';
  },
  tick(ms = 1000) {
    const steps = Math.max(1, Math.round(ms / 1000 * 120));
    for (let i = 0; i < steps; i++) update(FIXED);
  },
  draw() { render(); },
  debugContact() {
    const pts = shipWorldPts();
    return { type: levelDef.type, hasTerrain: !!terrain,
             pts: pts.map(p => ({ x: +p.x.toFixed(1), y: +p.y.toFixed(1),
                                  gy: terrain ? +heightAt(p.x).toFixed(1) : null })) };
  }
};

/* ---------- 启动 ---------- */
resize();
loadLevel(0);
ship.visible = false;   // 标题画面只展示地形
setAmbience(null);
state = 'title';
requestAnimationFrame(frame);
</script>
